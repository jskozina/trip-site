<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<title>Japan &amp; Vietnam</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{
  --bg:#FFFFFF;
  --surface:#FFFFFF;
  --text:#15171B;
  --muted:#6B7078;
  --faint:#A2A6AC;
  --line:#EDEDEB;
  --line-2:#D9D9D6;

  --accent:#B5451B;
  --accent-soft:#F4E7DF;

  --good:#1F6B47;
  --warn:#B0691F;
  --bad:#A33723;

  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;

  --radius:2px;
  --gutter:22px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:80px;
}
.wrap{max-width:1120px;margin:0 auto;padding:0 var(--gutter)}
img{max-width:100%;display:block}
svg{display:block;flex:none}
::selection{background:var(--text);color:var(--bg)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- masthead ---------- */
.masthead{padding:56px 0 32px}
.eyebrow{
  font-family:var(--mono);font-size:11px;letter-spacing:.22em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 18px;display:flex;align-items:center;gap:10px;
}
.eyebrow::after{content:'';height:1px;background:var(--line-2);flex:1}
.photostrip{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px 12px;margin:0 0 30px}
.photostrip a{
  display:flex;flex-direction:column;align-items:flex-start;gap:8px;
  text-decoration:none;min-width:0;animation:rise .5s ease both;
}
.photostrip .ph{width:100%;aspect-ratio:4/5;overflow:hidden;background:var(--line);position:relative}
.photostrip .ph img{width:100%;height:100%;object-fit:cover;transition:transform .4s ease}
.photostrip a:hover .ph img{transform:scale(1.06)}
.photostrip .lbl{
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-weight:600;
}
.masthead h1{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'SOFT' 20,'WONK' 1,'opsz' 100;
  font-weight:460;font-size:clamp(46px,8.5vw,84px);
  line-height:.94;letter-spacing:-.03em;margin:0;color:var(--text);
}
.datestrip{
  font-family:var(--mono);font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin:18px 0 0;font-variant-numeric:tabular-nums;
  padding-bottom:20px;border-bottom:1px solid var(--line);
}

/* ---------- countdown ---------- */
.status-bar{
  margin:28px 0 0;padding:22px 0;
  border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;position:relative;
}
.status-bar .n{
  font-family:'Fraunces',Georgia,serif;font-weight:500;
  font-size:34px;line-height:1;font-variant-numeric:tabular-nums;color:var(--text);
}
.status-bar .lbl{font-size:13px;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:8px}
.status-bar .lbl::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--line-2)}
.status-bar.live .lbl::before{background:var(--accent);animation:pulse 1.8s ease-in-out infinite}

/* ---------- summary ---------- */
.summary{
  display:flex;gap:40px;margin:22px 0 0;flex-wrap:wrap;
  font-size:11px;color:var(--faint);
  letter-spacing:.14em;text-transform:uppercase;font-weight:600;
}
.summary b{
  display:block;font-family:'Fraunces',Georgia,serif;font-weight:500;
  font-size:24px;color:var(--text);letter-spacing:normal;
  text-transform:none;font-variant-numeric:tabular-nums;margin-top:2px;
}

/* ---------- section label (shared) ---------- */
.section-label{
  font-family:var(--mono);
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--text);font-weight:600;margin:0 0 20px;
  display:flex;align-items:center;gap:10px;
}
.section-label::after{content:'';height:1px;background:var(--line);flex:1}

/* ---------- calendar ---------- */
.calendar{margin-top:64px;--g:3px;max-width:940px}
.cal-hint{font-family:var(--mono);font-size:11px;letter-spacing:.04em;color:var(--faint);margin:-6px 0 20px}
.cal-bleed{margin:0 -10px}
.cal-dows,.cal-days,.cal-lane,.cal-moves{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));column-gap:var(--g)}
.cal-dow{
  font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
  color:var(--faint);padding:0 1px 8px;
}
.cal-dow i{font-style:normal}
.cal-dow .l{display:none}
.cal-week{position:relative;margin-bottom:24px}
.cal-week:last-child{margin-bottom:0}

/* day tiles */
.cal-cell{position:relative;aspect-ratio:5/6}
.cal-day{
  position:absolute;inset:0;display:block;padding:0;border:0;border-radius:3px;overflow:hidden;cursor:pointer;
  background:var(--line) var(--img,none) center/cover no-repeat;
  filter:saturate(.8);transition:filter .25s ease,box-shadow .2s ease;
  font:inherit;color:inherit;text-align:left;-webkit-tap-highlight-color:transparent;
}
.cal-day::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(21,23,27,.42) 0%,rgba(21,23,27,0) 42%);pointer-events:none}
.cal-day:hover{filter:saturate(1.05)}
.cal-day.jn{right:calc(var(--g) * -1);border-top-right-radius:0;border-bottom-right-radius:0}
.cal-day.jp{border-top-left-radius:0;border-bottom-left-radius:0}
.cal-day.jp .jl{position:absolute;left:0;top:0;bottom:0;width:1px;background:rgba(255,255,255,.55);z-index:2}
.cal-day .n{
  position:absolute;top:5px;left:6px;z-index:1;
  font-family:var(--mono);font-size:11px;font-weight:600;line-height:1;color:#fff;
  font-variant-numeric:tabular-nums;text-shadow:0 1px 5px rgba(0,0,0,.5);
}
.cal-day .n small{display:block;font-size:7.5px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;margin-bottom:2px;opacity:.92}
.cal-day.noimg{background:linear-gradient(155deg,#F3F3F1,#E3E2DD)}
.cal-day.noimg::after{display:none}
.cal-day.noimg .n{color:var(--muted);text-shadow:none}
.cal-day .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',Georgia,serif;font-size:30px;color:rgba(21,23,27,.13)}
.cal-day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.cal-day.sel{filter:none;box-shadow:0 0 0 2px var(--text),inset 0 0 0 2px rgba(255,255,255,.92);z-index:3}

.cal-month{
  grid-row:1;align-self:end;padding:0 2px 8px;
  font-family:'Fraunces',Georgia,serif;font-style:italic;font-weight:460;
  font-size:clamp(30px,8vw,46px);line-height:.92;letter-spacing:-.025em;
  font-variation-settings:'SOFT' 20,'WONK' 1,'opsz' 100;color:var(--text);
}
.cal-month small{display:block;margin-top:9px;font-family:var(--mono);font-style:normal;font-size:11px;letter-spacing:.22em;color:var(--faint)}
.cal-legend{
  grid-row:1;align-self:end;display:flex;flex-direction:column;gap:6px;padding:0 2px 6px;
  font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);
}
.cal-legend span{display:flex;align-items:center;gap:7px;white-space:nowrap}
.cal-legend i{display:block;width:16px;height:2px;background:var(--c)}
.cal-legend i.dash{background:repeating-linear-gradient(90deg,var(--c) 0 4px,transparent 4px 7px)}

/* span brackets: one per stay, carrying the city name */
.cal-lane{margin-top:8px}
.cal-rib{
  --c:var(--faint);
  grid-row:1;position:relative;display:flex;flex-direction:column;justify-content:flex-start;width:100%;min-width:0;padding:9px 0 0;margin:0;border:0;background:none;
  font:inherit;color:inherit;text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.cal-rib::before{content:'';position:absolute;left:0;right:0;top:0;height:2px;background:var(--c);transition:height .15s ease}
.cal-rib .cp{position:absolute;top:-2px;width:2px;height:8px;background:var(--c)}
.cal-rib .cp.l{left:0}
.cal-rib .cp.r{right:0}
.cal-rib .cp.more{width:0;height:0;top:-3px;background:none;border-top:4px solid transparent;border-bottom:4px solid transparent}
.cal-rib .cp.l.more{left:-1px;border-right:5px solid var(--c)}
.cal-rib .cp.r.more{right:-1px;border-left:5px solid var(--c)}
.cal-rib .nm{
  display:block;max-width:100%;font-family:'Fraunces',Georgia,serif;font-weight:520;
  font-size:clamp(10px,2.85vw,13px);line-height:1.15;letter-spacing:-.012em;color:var(--text);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .15s ease;
}
.cal-rib .mt{display:block;margin-top:3px;font-family:var(--mono);font-size:8.5px;letter-spacing:.02em;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cal-rib.s1:not(.tr) .mt{display:none}
.cal-rib.tr::before{background:repeating-linear-gradient(90deg,var(--c) 0 5px,transparent 5px 8px)}
.cal-rib.tr .nm{display:flex;align-items:center;gap:4px;font-style:italic;color:var(--muted)}
.cal-rib.tr .nm svg{opacity:.7}
.cal-rib:hover .nm,.cal-rib.on .nm{color:var(--accent)}
.cal-rib.on::before{height:3px}

/* travel chips: flight codes + time */
.cal-moves{margin-top:9px}
.cal-mv{display:flex;flex-direction:column;gap:3px;min-width:0}
.mv{
  --c:var(--faint);
  display:flex;flex-direction:column;align-items:flex-start;gap:1px;width:100%;min-width:0;overflow:hidden;
  padding:3px 2px 3px 4px;border:0;border-left:2px solid var(--c);border-radius:0 2px 2px 0;
  background:#F5F5F3;font:inherit;color:var(--text);text-align:left;cursor:pointer;-webkit-tap-highlight-color:transparent;
}
.mv:hover{background:#ECEBE7}
.mv.mo{flex-direction:row;align-items:center;gap:4px;color:var(--muted)}
.mv .rt{font-family:var(--mono);font-size:9px;font-weight:600;letter-spacing:-.03em;white-space:nowrap}
.mv .tm{font-family:var(--mono);font-size:9px;letter-spacing:-.02em;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.mv .l{display:none}
.mv.ar .rt{font-weight:500;font-style:italic}

/* inline day detail */
.cal-detail{
  position:relative;margin-top:16px;padding:18px 18px 6px;background:#fff;
  border:1px solid var(--line-2);box-shadow:0 22px 44px -26px rgba(21,23,27,.4);animation:rise .28s ease both;
}
.cal-detail::before{
  content:'';position:absolute;top:-6px;width:10px;height:10px;background:#fff;
  border-left:1px solid var(--line-2);border-top:1px solid var(--line-2);
  transform:translateX(-50%) rotate(45deg);
  left:calc((100% - 6 * var(--g)) / 7 * (var(--col) + .5) + var(--g) * var(--col));
}
.cd-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.cd-date{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.cd-close{border:0;background:none;padding:0 2px;font:inherit;font-size:22px;line-height:1;color:var(--faint);cursor:pointer}
.cd-close:hover{color:var(--text)}
.cd-stay{display:grid;grid-template-columns:84px minmax(0,1fr);gap:14px;align-items:center;padding-bottom:16px;text-decoration:none;color:inherit}
.cd-stay.none{grid-template-columns:1fr}
.cd-photo{display:flex;align-items:center;justify-content:center;aspect-ratio:4/3;background:var(--line);overflow:hidden;border-radius:2px;color:var(--faint)}
.cd-photo img{width:100%;height:100%;object-fit:cover}
.cd-kicker{display:block;margin-bottom:5px;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.cd-name{display:block;font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:500;line-height:1.15;letter-spacing:-.01em}
.cd-sub{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;margin-top:9px}
.cd-go{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
a.cd-stay:hover .cd-name,a.cd-stay:hover .cd-go{color:var(--accent)}
.cd-note{margin:0 0 4px;padding-bottom:12px;font-size:13px;color:var(--muted)}
.cd-moves{border-top:1px solid var(--line)}
.cd-move{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:3px 12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);text-decoration:none;color:inherit}
.cd-move:last-child{border-bottom:0}
.cd-ico{color:var(--muted)}
.cd-main b{display:block;font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:500;line-height:1.2}
.cd-main i{display:block;margin-top:2px;font-style:normal;font-size:12px;color:var(--muted)}
.cd-main .status-dot{margin-top:7px}
.cd-times{text-align:right;font-family:var(--mono)}
.cd-times b{display:block;font-size:14px;font-weight:600;letter-spacing:.02em}
.cd-times i{display:block;margin-top:2px;font-style:normal;font-size:11px;color:var(--muted);white-space:nowrap}
.cd-tag{margin-right:6px;font-family:var(--mono);font-style:normal;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.cd-move:hover .cd-main b{color:var(--accent)}

@media (max-width:560px){
  .cd-move{grid-template-columns:26px minmax(0,1fr)}
  .cd-times{grid-column:2;text-align:left}
}
@media (min-width:640px){
  .calendar{--g:6px}
  .cal-bleed{margin:0}
  .cal-dow{font-size:10px;padding-bottom:10px}
  .cal-dow .l{display:inline}
  .cal-dow .s{display:none}
  .cal-week{margin-bottom:30px}
  .cal-cell{aspect-ratio:6/5}
  .cal-day .n{top:9px;left:10px;font-size:12.5px}
  .cal-day .n small{font-size:8.5px}
  .cal-rib{padding-top:12px}
  .cal-rib .nm{font-size:16px}
  .cal-rib .mt{font-size:10px}
  .cal-rib.s1:not(.tr) .mt{display:block}
  .cal-moves{margin-top:11px}
  .mv{padding:5px 8px 6px}
  .mv .rt,.mv .tm{font-size:10.5px;letter-spacing:0}
  .mv .s{display:none}
  .mv .l{display:block}
  .cal-detail{padding:22px 26px 8px}
  .cd-stay{grid-template-columns:132px minmax(0,1fr);gap:22px}
  .cd-name{font-size:23px}
}

/* ---------- map ---------- */
.mapSection{margin-top:64px}
.map{height:440px;overflow:hidden;border:1px solid var(--line);background:var(--surface);filter:grayscale(.4) contrast(1.05)}
.map-pin{
  width:24px;height:24px;border-radius:50%;background:var(--text);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:10.5px;font-weight:600;
  border:2px solid #fff;box-shadow:0 1px 5px rgba(21,23,27,.35);
}
.leaflet-popup-content-wrapper{border-radius:0}
.leaflet-popup-content{margin:14px 16px;font-family:'Archivo',sans-serif}
.map-popup img{width:100%;margin-bottom:10px;aspect-ratio:16/10;object-fit:cover}
.map-popup strong{font-family:'Fraunces',Georgia,serif;font-size:17px;font-weight:500}
.map-popup span{display:block;font-size:12px;color:var(--muted);margin-top:3px;font-family:var(--mono)}

/* ---------- budget ---------- */
.budget{margin-top:64px;max-width:680px}
.budget-hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:24px}
.budget-hd .section-label{margin-bottom:0;flex:1}
.view-toggle{display:flex;gap:18px;flex:none}
.view-toggle[hidden]{display:none}
.view-toggle button{
  border:none;background:none;border-bottom:1px solid transparent;font:inherit;font-family:var(--mono);
  font-size:10.5px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--faint);padding:0 0 3px;cursor:pointer;
}
.view-toggle button.active{color:var(--text);border-color:var(--accent)}
.budget-row{margin-bottom:28px}
.budget-row .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:9px}
.budget-row .cat{display:flex;align-items:center;gap:8px;font-family:'Fraunces',Georgia,serif;font-size:18px;font-weight:500;color:var(--text)}
.budget-row .cat svg{opacity:.4}
.budget-row .figs{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.budget-row .figs .over{color:var(--bad);font-weight:600}
.budget-bar{height:2px;background:var(--line);overflow:hidden}
.budget-bar .fill{height:100%;background:var(--text)}
.budget-bar .fill.warn{background:var(--warn)}
.budget-bar .fill.over{background:var(--bad)}
.budget-items{margin-top:12px}
.budget-item{
  display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  padding:8px 0;border-top:1px solid var(--line);font-size:13px;
}
.budget-item:first-child{border-top:none}
.budget-item a{color:var(--muted);text-decoration:none}
.budget-item a:hover{color:var(--text)}
.budget-item .cost{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.budget-item .cost.unset{color:var(--faint)}
.budget-item .cost.booked{color:var(--good);font-weight:600}
.budget-item .rough-tag{font-style:italic;color:var(--faint);margin-left:6px;font-size:11px}
.budget-item .city{color:var(--faint);margin-right:6px}
.budget-item .city::after{content:'\2014';margin-left:6px}
.budget-row .note{font-size:11.5px;color:var(--faint);margin:10px 0 0;font-style:italic}
.budget-total{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:22px;padding-top:18px;border-top:1px solid var(--text);
  font-size:14px;
}
.budget-total .cat{font-family:var(--mono);font-weight:600;color:var(--text);text-transform:uppercase;letter-spacing:.1em;font-size:12px}
.budget-total .figs{font-family:var(--mono);color:var(--text);font-variant-numeric:tabular-nums;font-weight:600}

/* ---------- leg grid ---------- */
.legs{display:flex;flex-direction:column;gap:76px;margin-top:76px}

/* status dot — replaces boxed pill throughout */
.status-dot{
  display:inline-flex;align-items:center;gap:7px;
  font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;
  font-weight:600;color:var(--muted);
}
.status-dot i{width:6px;height:6px;border-radius:50%;flex:none;background:currentColor}

.transit-row{
  display:flex;gap:16px;align-items:center;flex-wrap:wrap;
  padding:18px 0;border-bottom:1px solid var(--line);
}
.t-icon{width:34px;height:34px;flex:none;display:flex;align-items:center;justify-content:center;color:var(--text);opacity:.55}
.transit-row .body{min-width:0;flex:1 1 220px}
.transit-row .top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.transit-row .t{font-family:'Fraunces',Georgia,serif;color:var(--text);font-size:19px;font-weight:500;margin:0}
.transit-row .sub{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin:6px 0 0;letter-spacing:.03em}
.transit-row .d{color:var(--muted);font-size:13.5px;margin:7px 0 0;line-height:1.5;max-width:520px}
.board{flex:none;margin-left:auto;text-align:right}
.board .date{font-family:var(--mono);font-size:11px;color:var(--accent);letter-spacing:.08em;text-transform:uppercase;margin-bottom:5px;font-weight:600}
.board .route{
  font-family:var(--mono);font-size:20px;font-weight:600;color:var(--text);
  letter-spacing:.02em;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:8px;justify-content:flex-end;
}
.board .route .arrow{color:var(--faint);font-size:14px}
.board .time{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:5px;font-variant-numeric:tabular-nums}
.board .dur{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-top:4px}

/* connecting-flight / linked-transit group */
.transit-group{animation:rise .5s ease both}
.transit-group .group-label{
  font-family:var(--mono);
  font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
  font-weight:700;margin:0;padding:0 0 6px;
}
.transit-group .transit-row{border-bottom:1px dashed var(--line)}
.transit-group .transit-row:last-of-type{border-bottom:1px solid var(--line)}
.connector{
  display:flex;align-items:center;gap:8px;padding:9px 0 9px 50px;
  font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.06em;text-transform:uppercase;
}

.leg-card{
  display:flex;flex-direction:column;
  animation:rise .6s ease both;
}
.leg-card.now .leg-media::after{
  content:'';position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--accent);pointer-events:none;
}

.leg-media{
  position:relative;
  width:100vw;margin-left:calc(50% - 50vw);
  height:clamp(280px,52vw,620px);
  background:linear-gradient(155deg,#F1F1EF,#FAFAF8);
}
.leg-media img{width:100%;height:100%;object-fit:cover}
.leg-media .mono{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',Georgia,serif;font-size:96px;color:rgba(21,23,27,.1);
}
.leg-media .now-badge{
  position:absolute;top:24px;left:max(22px,calc((100vw - 1120px)/2 + 22px));background:var(--accent);color:#fff;
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
  padding:7px 14px;display:flex;align-items:center;gap:7px;
}
.leg-media .now-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.8s ease-in-out infinite}
.leg-media .leg-index{
  position:absolute;bottom:20px;left:max(22px,calc((100vw - 1120px)/2 + 22px));color:#fff;font-family:var(--mono);
  font-size:12px;letter-spacing:.1em;text-shadow:0 1px 6px rgba(0,0,0,.4);
}

.leg-content{padding:28px 0 0}
.leg-summary{max-width:640px}
.leg-card h2{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'SOFT' 20,'WONK' 1,'opsz' 60;
  font-weight:500;font-size:clamp(34px,5vw,54px);line-height:1;margin:0;
  letter-spacing:-.02em;color:var(--text);
}
.leg-stats{display:flex;gap:36px;margin-top:18px;padding-top:18px;border-top:1px solid var(--line)}
.leg-stats .stat{display:flex;flex-direction:column}
.leg-stats .v{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.15}
.leg-stats .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:4px}
.localtime{
  font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.02em;
  margin:14px 0 0;font-variant-numeric:tabular-nums;
}
.spend{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:13px;color:var(--text);margin-top:12px;font-variant-numeric:tabular-nums}
.spend svg{opacity:.5}
.leg-summary>p.body-text{color:var(--muted);font-size:15.5px;margin:16px 0 0;line-height:1.65;max-width:56ch}

.grp-label{
  font-family:'Fraunces',Georgia,serif;font-style:italic;
  font-size:20px;
  color:var(--text);font-weight:500;margin:40px 0 20px;
}
.subgrp-label{
  display:flex;align-items:center;gap:8px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);font-weight:600;margin:28px 0 16px;
}
.subgrp-label:first-of-type{margin-top:4px}
.subgrp-label svg{opacity:.55}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:32px 24px}

/* ---------- stay feature (full-width accommodation) ---------- */
.stay-feature{
  display:flex;gap:36px;margin:0 0 8px;animation:rise .6s ease both;
}
.stay-feature .ic-media{flex:0 0 44%;aspect-ratio:4/3;border-radius:2px}
.stay-feature .ic-body{flex:1;min-width:0;padding:0;display:flex;flex-direction:column;justify-content:center}
.stay-feature h3{font-size:26px}
.stay-feature p{font-size:14.5px;max-width:46ch}
.stay-feature .ic-eyebrow{margin-bottom:9px}
.stay-feature .row{margin-top:16px}
@media (max-width:680px){
  .stay-feature{flex-direction:column;gap:18px}
  .stay-feature .ic-media{flex:none;width:100%;aspect-ratio:16/11}
  .stay-feature h3{font-size:22px}
}

/* ---------- per-city mini map ---------- */
.mini-map{
  height:300px;margin:0 0 36px;overflow:hidden;
  border:1px solid var(--line);background:var(--surface);
  filter:grayscale(.4) contrast(1.05);
}
.mini-pin{
  width:22px;height:22px;border-radius:50%;background:var(--text);color:#fff;
  display:flex;align-items:center;justify-content:center;
  border:2px solid #fff;box-shadow:0 1px 5px rgba(21,23,27,.35);
}
.mini-pin.stay{background:var(--accent)}
.mini-pin svg{width:11px;height:11px}
.mini-pin.you{background:#2E5E8C;box-shadow:0 0 0 4px rgba(46,94,140,.28),0 1px 5px rgba(21,23,27,.35);animation:pulse 1.8s ease-in-out infinite}
.mini-popup img{width:100%;margin-bottom:8px;aspect-ratio:2.4/1;object-fit:cover}
.mini-popup strong{font-family:'Fraunces',Georgia,serif;font-size:15px;font-weight:500;display:block}
.mini-popup span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;font-family:var(--mono)}
.mini-locate a{
  width:28px;height:28px;display:flex;align-items:center;justify-content:center;
  background:#fff;color:var(--text);cursor:pointer;
}
.mini-locate a:hover{color:var(--accent)}
.mini-locate.loading a{color:var(--faint);animation:pulse 1s ease-in-out infinite}
.item-card{display:flex;flex-direction:column}
.ic-media{aspect-ratio:4/5;background:var(--line);overflow:hidden;position:relative}
.ic-media img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1),filter .5s ease;filter:grayscale(.1)}
.item-card:hover .ic-media img{transform:scale(1.035);filter:grayscale(0)}
.ic-gallery{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.ic-gallery::-webkit-scrollbar{display:none}
.ic-gallery img{flex:0 0 100%;scroll-snap-align:start;transform:none !important}
.item-card:hover .ic-gallery img{transform:none !important}
.ic-dots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px;pointer-events:none}
.ic-dots span{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.5);transition:background .15s ease}
.ic-dots span.active{background:#fff}
.ic-body{padding:14px 0 0}
.ic-eyebrow{
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--accent);font-weight:600;margin:0 0 6px;
}
.item-card h3{font-family:'Fraunces',Georgia,serif;font-size:19px;font-weight:500;margin:0;letter-spacing:-.008em;color:var(--text);line-height:1.2}
.item-card .meta{font-size:12px;color:var(--muted);margin:3px 0 0}
.item-card p{font-size:13.5px;color:var(--muted);margin:7px 0 0;line-height:1.55}
.item-card .row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-top:11px}
a.lnk{
  font-family:var(--mono);
  color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;text-decoration:none;
}
a.lnk:hover{color:var(--accent)}
.price{font-family:var(--mono);font-size:12px;color:var(--text);font-variant-numeric:tabular-nums}

.leg-content>.row{margin-top:22px}

/* footer */
footer{
  margin:80px 0 0;padding-top:24px;border-top:1px solid var(--line);
  font-family:var(--mono);
  font-size:11.5px;color:var(--faint);line-height:1.6;letter-spacing:.02em;
}
.err{
  border-left:3px solid var(--warn);
  padding:16px 0 16px 18px;margin:30px 0;color:var(--muted);font-size:14.5px;
}
.err code{
  font-family:ui-monospace,monospace;font-size:13px;
  background:var(--line);padding:2px 5px;color:var(--text);
}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Field Notes</p>
    <div class="photostrip" id="photoStrip"></div>
    <h1 id="title">Loading</h1>
    <p class="datestrip" id="dateStrip"></p>
    <div class="status-bar" id="statusBar" hidden>
      <span class="n" id="statusNum"></span>
      <span class="lbl" id="statusLbl"></span>
    </div>
    <div class="summary" id="summary"></div>
  </header>
  <section class="calendar" id="calendarWrap" hidden>
    <p class="section-label">Calendar</p>
    <p class="cal-hint">Tap a day for the stay and travel details.</p>
    <div class="cal-bleed"><div id="calendar"></div></div>
  </section>
  <section class="mapSection" id="mapWrap" hidden>
    <p class="section-label">Route</p>
    <div class="map" id="map"></div>
  </section>
  <section class="budget" id="budgetWrap" hidden>
    <div class="budget-hd">
      <p class="section-label">Budget</p>
      <div class="view-toggle" id="budgetViewToggle" hidden>
        <button type="button" data-view="together">Together</button>
        <button type="button" data-view="person">Per person</button>
      </div>
    </div>
    <div id="budgetRows"></div>
  </section>
  <main class="legs" id="timeline"></main>
  <footer id="footer"></footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const CACHE_KEY = 'trip-cache-v1';

const ICONS = {
  plane: '<path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2Z"/>',
  train: '<rect x="5" y="3" width="14" height="12" rx="4"/><path d="M5 10h14"/><circle cx="8.5" cy="17.5" r="1.5"/><circle cx="15.5" cy="17.5" r="1.5"/><path d="M7 19l-2 3"/><path d="M17 19l2 3"/>',
  car: '<path d="M5 11l1.6-4.6A2 2 0 0 1 8.5 5h7a2 2 0 0 1 1.9 1.4L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/>',
  bus: '<rect x="4" y="4" width="16" height="12" rx="2"/><path d="M4 11h16"/><path d="M8 4v7"/><path d="M16 4v7"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/>',
  boat: '<path d="M2 20l1.6-4.5h16.8L22 20"/><path d="M4.5 15.5l1-9h5l1 9"/><path d="M12 3v3.5"/>',
  walk: '<circle cx="13" cy="4" r="2"/><path d="M9 22l1.6-7L8 13l1-5 4-1 3 3 3 1"/><path d="M10.5 15l3 1 2 6"/>',
  bed: '<path d="M3 18v-7a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v3"/><path d="M12 14v-2a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v6"/><path d="M3 18h18"/><path d="M3 11V6"/>',
  eat: '<path d="M6 2v7a3 3 0 0 0 6 0V2"/><path d="M9 9v13"/><path d="M17 2v9"/><path d="M17 11a2 2 0 0 0 2-2V2"/><path d="M17 11v11"/>',
  see: '<path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>',
  shop: '<path d="M6 8h12l-1.2 12.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  drink: '<path d="M5 3h14l-1.6 15.2a2 2 0 0 1-2 1.8H8.6a2 2 0 0 1-2-1.8L5 3Z"/><path d="M6.5 8h11"/>',
  do: '<circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/>',
  locate: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3"/><path d="M12 19v3"/><path d="M2 12h3"/><path d="M19 12h3"/>',
  idea: '<path d="M9 18h6"/><path d="M10 21.5h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1v.2h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/>',
  shortlist: '<path d="M6 3h12v18l-6-4-6 4V3Z"/>',
  held: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3.5 2"/>',
  booked: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9"/>',
  home: '<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M10 20v-6h4v6"/>',
  pin: '<path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.4"/>'
};

const STATUS = {
  idea:      { c:'#5B6472', bg:'#F1EFEA', bd:'#D8D1C0', label:'Idea',      icon:'idea' },
  shortlist: { c:'#2E5E8C', bg:'#EDF4FA', bd:'#B7D2EA', label:'Shortlist', icon:'shortlist' },
  held:      { c:'#8A6A12', bg:'#FBF4E1', bd:'#EAD8A0', label:'Held',      icon:'held' },
  booked:    { c:'#1F6B47', bg:'#E9F7EF', bd:'#B0DDC4', label:'Booked',    icon:'booked' },
};

// Generic stand-in photos used when a stay/spot has no image of its own
const CATEGORY_IMG = {
  stay:  'https://images.unsplash.com/photo-1746549855427-57e6da7040db',
  eat:   'https://images.unsplash.com/photo-1695753568605-d8653d5319e6',
  see:   'https://images.unsplash.com/photo-1742268350523-70a032f3520d',
  shop:  'https://images.unsplash.com/photo-1770024598483-b8e109485d7d',
  drink: 'https://images.unsplash.com/photo-1533539848852-cdbd1b77339d',
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d = s => { const [y,m,dd] = String(s).split('-').map(Number); return new Date(y, m-1, dd); };
const dkey = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const nights = (a,b) => (a&&b) ? Math.round((d(b)-d(a))/86400000) : 0;
const initial = s => (s || '?').trim().charAt(0).toUpperCase();
const money = n => '$' + Math.round(n).toLocaleString();
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function resizeImg(url, w, h){
  if(!url) return url;
  try{
    const u = new URL(url);
    u.searchParams.set('w', w);
    if(h) u.searchParams.set('h', h);
    u.searchParams.set('fit', 'crop');
    u.searchParams.set('crop', 'entropy');
    u.searchParams.set('q', '75');
    u.searchParams.set('auto', 'format');
    return u.toString();
  }catch(e){ return url; }
}

function svgIcon(key, size){
  size = size || 16;
  const inner = ICONS[key] || ICONS.pin;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
}

function iconForMode(mode){
  const m = (mode||'').toLowerCase();
  if(m.includes('flight')) return 'plane';
  if(m.includes('train')) return 'train';
  if(m.includes('car')) return 'car';
  if(m.includes('bus')) return 'bus';
  if(m.includes('ferry') || m.includes('boat')) return 'boat';
  return 'walk';
}
function iconForCategory(category){
  const c = (category||'').toLowerCase();
  if(c==='eat') return 'eat';
  if(c==='shop') return 'shop';
  if(c==='drink') return 'drink';
  return 'see';
}
function statusInfo(status){ return STATUS[status] || STATUS.idea; }

function dateRange(a,b){
  if(!a) return '';
  const A = d(a);
  if(!b || a===b) return `${A.getDate()} ${MONTHS[A.getMonth()]}`;
  const B = d(b);
  return A.getMonth()===B.getMonth()
    ? `${A.getDate()}–${B.getDate()} ${MONTHS[B.getMonth()]}`
    : `${A.getDate()} ${MONTHS[A.getMonth()]} – ${B.getDate()} ${MONTHS[B.getMonth()]}`;
}

function dayDate(s){
  if(!s) return '';
  const D = d(s);
  return `${DOW[D.getDay()]} ${D.getDate()} ${MONTHS[D.getMonth()]}`;
}

function dateLong(s){
  if(!s) return '';
  const D = d(s);
  return `${D.getDate()} ${MONTHS[D.getMonth()]} ${D.getFullYear()}`;
}

function localTime(tz){
  try{
    return new Intl.DateTimeFormat('en-AU',{hour:'2-digit',minute:'2-digit',timeZone:tz,hour12:false}).format(new Date());
  }catch(e){ return null; }
}

function mapLink(o, city){
  if(o.lat && o.lng) return `https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lng}`;
  const query = city ? `${o.title}, ${city}` : o.title;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(query)}`;
}

function pill(status){
  if(!status) return '';
  const s = statusInfo(status);
  return `<span class="status-dot" style="color:${s.c}"><i></i>${esc(s.label)}</span>`;
}

function timeGapMinutes(t1, t2){
  const [h1,m1] = t1.split(':').map(Number);
  const [h2,m2] = t2.split(':').map(Number);
  let diff = (h2*60+m2) - (h1*60+m1);
  if(diff < 0) diff += 1440;
  return diff;
}

function fmtDur(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return h ? `${h}h${m ? String(m).padStart(2,'0')+'m' : ''}` : `${m}m`;
}

function connectorHtml(a, b){
  if(a.arriveTime && b.departTime){
    const mins = timeGapMinutes(a.arriveTime, b.departTime);
    return `<div class="connector">${fmtDur(mins)} layover${a.to ? ' · '+esc(a.to) : ''}</div>`;
  }
  return `<div class="connector">Then by ${esc((b.mode||'transfer').toLowerCase())}</div>`;
}

function transitInner(l, extraClass, idAttr, styleAttr){
  const hasTimes = l.departTime && l.arriveTime;
  const hasRoute = l.from && l.to;
  return `<div class="transit-row ${extraClass||''}" ${idAttr?`id="${idAttr}"`:''} style="${styleAttr||''}">
    <div class="t-icon">${svgIcon(iconForMode(l.mode),20)}</div>
    <div class="body">
      <div class="top">
        <p class="t">${esc(l.title)}</p>
        ${pill(l.status)}
      </div>
      <p class="sub">${esc(l.mode||'Transit')}${l.flightNo ? ' · '+esc(l.flightNo) : ''}${l.priceAud ? ' · '+money(l.priceAud)+((l.mode||'').toLowerCase()==='flight' ? ' pp' : '') : ''}</p>
      ${l.body ? `<p class="d">${esc(l.body)}</p>` : ''}
    </div>
    <div class="board">
      <div class="date">${esc(dayDate(l.start))}</div>
      ${hasRoute ? `<div class="route">${esc(l.from)}<span class="arrow">→</span>${esc(l.to)}</div>` : ''}
      ${hasTimes ? `<div class="time">${esc(l.departTime)}–${esc(l.arriveTime)}</div>` : ''}
      ${l.duration ? `<div class="dur">${esc(l.duration)}</div>` : ''}
    </div>
  </div>`;
}

function itemCard(o, kind, city, feature){
  const eyebrow = o.category || o.subtitle || (kind === 'stay' ? 'Stay' : '');
  const meta = dateRange(o.start,o.end);
  const n = nights(o.start,o.end);
  const cost = (o.priceAud && n) ? `<span class="price">${money(o.priceAud)}/night · ${money(o.priceAud*n)} total</span>`
             : (o.priceAud ? `<span class="price">${money(o.priceAud)}</span>` : '');
  const bucket = kind === 'stay' ? 'stay' : iconForCategory(o.category);
  const gallery = kind === 'stay' && Array.isArray(o.images) && o.images.length > 1 ? o.images : null;
  const imgSize = feature ? [900,675] : [500,625];
  let media;
  if(gallery){
    const imgs = gallery.map(src => `<img src="${esc(resizeImg(src,imgSize[0],imgSize[1]))}" alt="" loading="lazy">`).join('');
    const dots = gallery.map((_,i) => `<span class="${i===0?'active':''}"></span>`).join('');
    media = `<div class="ic-gallery">${imgs}</div><div class="ic-dots">${dots}</div>`;
  } else {
    const src = o.image || CATEGORY_IMG[bucket];
    media = `<img src="${esc(resizeImg(src,imgSize[0],imgSize[1]))}" alt="" loading="lazy">`;
  }
  return `<div class="${feature?'stay-feature':'item-card'}" id="item-${esc(o.id)}">
    <div class="ic-media">${media}</div>
    <div class="ic-body">
      ${eyebrow ? `<p class="ic-eyebrow">${esc(eyebrow)}</p>` : ''}
      <h3>${esc(o.title)}</h3>
      ${meta ? `<p class="meta">${esc(meta)}</p>` : ''}
      ${o.body ? `<p>${esc(o.body)}</p>` : ''}
      <div class="row">
        ${pill(o.status)}
        ${cost}
        <a class="lnk" href="${mapLink(o, city)}" target="_blank" rel="noopener">Map ↗</a>
        ${o.url ? `<a class="lnk" href="${esc(o.url)}" target="_blank" rel="noopener">Site ↗</a>` : ''}
      </div>
    </div>
  </div>`;
}

let ANCHOR_MAP = {};

function computeAnchorMap(legs){
  const map = {};
  legs.forEach((l,i) => {
    if(l.type !== 'transit') return;
    if(l.group && i>0 && legs[i-1].type==='transit' && legs[i-1].group===l.group){
      map[l.id] = map[legs[i-1].id];
    } else {
      map[l.id] = l.id;
    }
  });
  return map;
}

/* ---------- calendar ---------- */
const CAL = { days: new Map(), sel: null, returnKey: null, used: new Set() };

function stayForNight(leg, dt){
  return (leg.stays||[]).find(s => s.start && s.end && dt >= d(s.start) && dt < d(s.end));
}

const imgKey = u => String(u || '').split('?')[0];

// Candidate photos for a city, best calendar tiles first. Stay photos come last so
// the room shots are saved for the tap-through panel.
function legPhotoPool(leg){
  const out = [];
  (leg.images || []).forEach(u => out.push(u));
  if(leg.image) out.push(leg.image);
  const rank = s => ({ See:0, Do:1, Eat:2 })[spotBucket(s.category)];
  (leg.spots || []).map((s,i) => ({ s, i }))
    .sort((a,b) => rank(a.s) - rank(b.s) || a.i - b.i)
    .forEach(x => { if(x.s.image) out.push(x.s.image); });
  (leg.stays || []).forEach(st => { (st.images || []).forEach(u => out.push(u)); if(st.image) out.push(st.image); });
  return out;
}

function takeImage(cands, used){
  for(const u of cands){
    if(!u) continue;
    const k = imgKey(u);
    if(!used.has(k)){ used.add(k); return u; }
  }
  return null;
}

const isFlight = t => (t.mode || '').toLowerCase() === 'flight';

function buildCalendarModel(trip, legs){
  const cities = legs.filter(l => l.type !== 'transit');
  const transits = legs.filter(l => l.type === 'transit');

  const days = [];
  for(let c = d(trip.depart), e = d(trip.return); c <= e; c = new Date(c.getFullYear(), c.getMonth(), c.getDate() + 1)) days.push(c);

  const model = days.map((dt, i) => {
    const key = dkey(dt);
    const leg = cities.find(l => dt >= d(l.start) && dt < d(l.end)) || null;
    let span = null;
    if(leg) span = { id:'leg:' + leg.id, kind:'leg', item:leg };
    else {
      const t = transits.find(x => x.end && x.start !== x.end && dt >= d(x.start) && dt < d(x.end));
      if(t) span = { id:'tr:' + t.id, kind:'tr', item:t };
    }
    return {
      i, key, dt, leg, span,
      starts: transits.filter(t => t.start === key),
      ends: transits.filter(t => t.end === key && t.start !== key),
      chips: [], img: null
    };
  });

  model.forEach(m => {
    let lastGroup = null;
    m.starts.forEach(t => {
      if(isFlight(t)){ m.chips.push({ kind:'flight', t }); lastGroup = null; return; }
      if(t.group && t.group === lastGroup) return;
      lastGroup = t.group || null;
      m.chips.push({ kind:'move', t });
    });
    m.ends.filter(t => isFlight(t) && t.arriveTime).forEach(t => m.chips.push({ kind:'arrive', t }));
  });

  // one distinct photo per day, never repeated across the whole calendar
  const used = new Set();
  CAL.used = used;
  const pools = new Map(cities.map(l => [l.id, legPhotoPool(l)]));
  let lastLeg = null;
  model.forEach(m => {
    let cands = [];
    if(m.leg){ lastLeg = m.leg; cands = pools.get(m.leg.id); }
    else if(m.span){
      const t = m.span.item;
      cands = [].concat(t.images || [], t.image || [], lastLeg ? pools.get(lastLeg.id) : []);
    } else {
      cands = m.starts.map(t => t.image).filter(Boolean);
    }
    m.cands = cands;
    m.img = takeImage(cands, used);
  });

  const lead = (model[0].dt.getDay() + 6) % 7;
  const slots = Array(lead).fill(null).concat(model);
  while(slots.length % 7) slots.push(null);
  const weeks = [];
  for(let i = 0; i < slots.length; i += 7) weeks.push(slots.slice(i, i + 7));
  return { model, weeks, lead, tail: slots.length - lead - model.length };
}

function calSpanStatus(m){
  if(!m.span) return null;
  if(m.span.kind === 'leg'){
    const st = (m.span.item.stays || [])[0];
    return st ? (st.status || 'idea') : 'idea';
  }
  return m.span.item.status || 'idea';
}

function calDayHtml(m, col, wk, today){
  const prev = wk[col - 1], next = wk[col + 1];
  const jp = !!(m.span && prev && prev.span && prev.span.id === m.span.id);
  const jn = !!(m.span && next && next.span && next.span.id === m.span.id);
  const isToday = m.dt.getTime() === today.getTime();
  const showMonth = m.i === 0 || m.dt.getDate() === 1;
  const num = (showMonth ? `<small>${MONTHS[m.dt.getMonth()]}</small>` : '') + m.dt.getDate();
  const long = new Intl.DateTimeFormat('en-AU', { weekday:'long', day:'numeric', month:'long' }).format(m.dt);
  const label = long + (m.leg ? `, ${m.leg.title}` : '');
  const ph = m.img ? '' : `<span class="ph">${m.leg ? esc(initial(m.leg.title)) : svgIcon('home', 22)}</span>`;
  const style = m.img ? ` style="--img:url('${esc(resizeImg(m.img, 260, 310))}')"` : '';
  const cls = ['cal-day', jp ? 'jp' : '', jn ? 'jn' : '', isToday ? 'today' : '', m.img ? '' : 'noimg'].filter(Boolean).join(' ');
  return `<div class="cal-cell" style="grid-column:${col + 1}"><button type="button" class="${cls}" data-key="${m.key}" data-col="${col}"${style} aria-label="${esc(label)}">${jp ? '<i class="jl"></i>' : ''}<span class="n">${num}</span>${ph}</button></div>`;
}

function calRibbonHtml(seg, wk, model){
  const m0 = wk[seg.start], m1 = wk[seg.end];
  const len = seg.end - seg.start + 1;
  const prev = model[m0.i - 1], next = model[m1.i + 1];
  const contL = !!(prev && prev.span && prev.span.id === seg.id);
  const contR = !!(next && next.span && next.span.id === seg.id);
  const c = statusInfo(calSpanStatus(m0)).c;
  const it = seg.item;
  let cls = 'cal-rib' + (len === 1 ? ' s1' : '');
  let inner, aria;
  if(seg.kind === 'leg'){
    const n = nights(it.start, it.end);
    inner = `<span class="nm">${esc(it.title)}</span><span class="mt">${contL ? 'cont.' : `${n} night${n === 1 ? '' : 's'}`}</span>`;
    aria = `${it.title}, ${n} night${n === 1 ? '' : 's'}`;
  } else {
    cls += ' tr';
    const mode = (it.mode || 'travel');
    inner = `<span class="nm">${svgIcon(iconForMode(it.mode), 12)}<span>${esc(mode)}</span></span><span class="mt">overnight</span>`;
    aria = `Overnight ${mode.toLowerCase()}`;
  }
  return `<button type="button" class="${cls}" style="grid-column:${seg.start + 1} / span ${len};--c:${c}" data-key="${m0.key}" data-a="${m0.key}" data-b="${m1.key}" aria-label="${esc(aria)}"><i class="cp l${contL ? ' more' : ''}"></i><i class="cp r${contR ? ' more' : ''}"></i>${inner}</button>`;
}

function calChipHtml(c, m){
  const t = c.t;
  const col = statusInfo(t.status).c;
  const open = `<button type="button" class="mv%CLS%" style="--c:${col}" data-key="${m.key}" aria-label="${esc(t.title)}">`;
  if(c.kind === 'flight'){
    const sh = (t.from && t.to) ? `${t.from}→${t.to}` : t.title;
    const lg = (t.from && t.to) ? `${t.from} → ${t.to}` : t.title;
    const tl = t.departTime && t.arriveTime ? `${t.departTime} – ${t.arriveTime}` : (t.departTime || '');
    return open.replace('%CLS%', '') +
      `<span class="rt s">${esc(sh)}</span><span class="rt l">${esc(lg)}</span>` +
      (t.departTime ? `<span class="tm s">${esc(t.departTime)}</span><span class="tm l">${esc(tl)}</span>` : '') + '</button>';
  }
  if(c.kind === 'arrive'){
    return open.replace('%CLS%', ' ar') +
      `<span class="rt s">↘${esc(t.to || '')}</span><span class="rt l">Arrives ${esc(t.to || '')}</span><span class="tm">${esc(t.arriveTime)}</span></button>`;
  }
  return open.replace('%CLS%', ' mo') + svgIcon(iconForMode(t.mode), 12) + (t.departTime ? `<span class="tm">${esc(t.departTime)}</span>` : '') + '</button>';
}

function calWeekHtml(wk, wi, weeks, ctx){
  const { model, lead, tail, today, statuses } = ctx;
  const cells = [];
  wk.forEach((m, col) => {
    if(m){ cells.push(calDayHtml(m, col, wk, today)); return; }
    if(wi === 0 && col === 0 && lead >= 3){
      const dt = model[0].dt;
      cells.push(`<div class="cal-month" style="grid-column:1 / span ${lead}">${esc(new Intl.DateTimeFormat('en-AU', { month:'long' }).format(dt))}<small>${dt.getFullYear()}</small></div>`);
    }
    if(wi === weeks.length - 1 && tail >= 3 && col === 7 - tail){
      const rows = [...statuses].map(s => `<span style="--c:${statusInfo(s).c}"><i></i>${esc(statusInfo(s).label)}</span>`).join('');
      cells.push(`<div class="cal-legend" style="grid-column:${col + 1} / -1">${rows}<span style="--c:var(--faint)"><i class="dash"></i>Overnight travel</span></div>`);
    }
  });

  // contiguous runs of the same stay become one bracket
  const segs = [];
  let cur = null;
  wk.forEach((m, i) => {
    const id = m && m.span ? m.span.id : null;
    if(id && cur && cur.id === id){ cur.end = i; return; }
    if(cur) segs.push(cur);
    cur = id ? { id, kind:m.span.kind, item:m.span.item, start:i, end:i } : null;
  });
  if(cur) segs.push(cur);
  const lane = segs.map(s => calRibbonHtml(s, wk, model)).join('');

  const moveCols = wk.map(m => (m && m.chips.length) ? m.chips.map(c => calChipHtml(c, m)).join('') : '');
  const moves = moveCols.some(Boolean)
    ? `<div class="cal-moves">${moveCols.map((h, i) => h ? `<div class="cal-mv" style="grid-column:${i + 1}">${h}</div>` : '').join('')}</div>`
    : '';

  return `<div class="cal-week"><div class="cal-days">${cells.join('')}</div><div class="cal-lane">${lane}</div>${moves}<div class="cal-detail" hidden></div></div>`;
}

function renderCalendar(trip, legs){
  CAL.days.clear();
  if(!trip.depart || !trip.return) return '';
  const { model, weeks, lead, tail } = buildCalendarModel(trip, legs);
  model.forEach(m => CAL.days.set(m.key, m));
  CAL.returnKey = model[model.length - 1].key;

  const today = new Date(); today.setHours(0,0,0,0);
  const statuses = new Set();
  model.forEach(m => {
    const s = calSpanStatus(m); if(s) statuses.add(s);
    m.chips.forEach(c => statuses.add(c.t.status || 'idea'));
  });

  const dows = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun']
    .map(n => `<span class="cal-dow"><i class="l">${n}</i><i class="s">${n[0]}</i></span>`).join('');
  const ctx = { model, lead, tail, today, statuses: ['booked','held','shortlist','idea'].filter(s => statuses.has(s)) };
  return `<div class="cal-dows" aria-hidden="true">${dows}</div>` + weeks.map((wk, wi) => calWeekHtml(wk, wi, weeks, ctx)).join('');
}

// Remote photos can vanish or be blocked; swap a dead tile for the next unused photo.
function calVerifyPhotos(){
  document.querySelectorAll('#calendar .cal-day[style*="--img"]').forEach(tile => {
    const m = CAL.days.get(tile.dataset.key);
    const attempt = src => {
      const im = new Image();
      im.onerror = () => {
        const next = takeImage(m.cands || [], CAL.used);
        if(next){ const u = resizeImg(next, 260, 310); tile.style.setProperty('--img', `url('${u}')`); attempt(u); }
        else {
          tile.style.removeProperty('--img');
          tile.classList.add('noimg');
          if(!tile.querySelector('.ph')) tile.insertAdjacentHTML('beforeend', `<span class="ph">${m.leg ? esc(initial(m.leg.title)) : svgIcon('home', 22)}</span>`);
        }
      };
      im.src = src;
    };
    attempt(tile.style.getPropertyValue('--img').trim().replace(/^url\(["']?|["']?\)$/g, ''));
  });
}

// Shrink any city label that would be clipped until it fits its span.
function fitCalLabels(){
  document.querySelectorAll('#calendar .cal-rib:not(.tr) .nm').forEach(el => {
    el.style.fontSize = '';
    let size = parseFloat(getComputedStyle(el).fontSize);
    const r = document.createRange();
    r.selectNodeContents(el);
    while(r.getBoundingClientRect().width > el.getBoundingClientRect().width - 1 && size > 8.5){
      size -= 0.25;
      el.style.fontSize = size + 'px';
    }
  });
}

function calMoveRowHtml(t, arriving){
  const flight = isFlight(t);
  const codes = (t.from && t.to) ? `${t.from} → ${t.to}` : '';
  const times = t.departTime && t.arriveTime ? `${t.departTime} – ${t.arriveTime}` : (t.departTime || '');
  const when = [times, t.duration].filter(Boolean).join(' · ');
  const sub = [flight ? t.flightNo : t.mode, flight ? t.group : ''].filter(Boolean).join(' · ');
  return `<a class="cd-move" href="#leg-${esc(ANCHOR_MAP[t.id] || t.id)}">
    <span class="cd-ico">${svgIcon(iconForMode(t.mode), 18)}</span>
    <span class="cd-main"><b>${arriving ? '<em class="cd-tag">Arrives</em>' : ''}${esc(t.title)}</b>${sub ? `<i>${esc(sub)}</i>` : ''}${pill(t.status)}</span>
    <span class="cd-times">${codes ? `<b>${esc(codes)}</b>` : ''}${when ? `<i>${esc(when)}</i>` : ''}</span>
  </a>`;
}

function calDetailHtml(m){
  const dayLbl = new Intl.DateTimeFormat('en-AU', { weekday:'long', day:'numeric', month:'long' }).format(m.dt);
  let head = '', note = '';
  if(m.leg){
    const n = Math.round((m.dt - d(m.leg.start)) / 86400000) + 1;
    const total = nights(m.leg.start, m.leg.end);
    const kicker = `${esc(m.leg.title)} · Night ${n} of ${total}`;
    const st = stayForNight(m.leg, m.dt);
    if(st){
      const sn = nights(st.start, st.end);
      const cost = st.priceAud ? `<span class="price">${money(st.priceAud)}/night${sn ? ` · ${money(st.priceAud * sn)} total` : ''}</span>` : '';
      head = `<a class="cd-stay" href="#item-${esc(st.id)}">
        <span class="cd-photo">${st.image ? `<img src="${esc(resizeImg(st.image, 260, 195))}" alt="" loading="lazy">` : svgIcon('bed', 24)}</span>
        <span class="cd-info"><span class="cd-kicker">${kicker}</span><span class="cd-name">${esc(st.title)}</span>
        <span class="cd-sub">${pill(st.status)}${cost}<span class="cd-go">View stay ↓</span></span></span>
      </a>`;
    } else {
      head = `<div class="cd-stay none"><span class="cd-info"><span class="cd-kicker">${kicker}</span><span class="cd-name">No stay locked in yet</span></span></div>`;
    }
  } else if(m.span){
    note = `<p class="cd-note">Overnight ${esc((m.span.item.mode || 'travel').toLowerCase())}, so no hotel tonight.</p>`;
  } else if(m.key === CAL.returnKey){
    note = `<p class="cd-note">Back home.</p>`;
  }
  const rows = m.starts.map(t => calMoveRowHtml(t, false)).concat(m.ends.map(t => calMoveRowHtml(t, true))).join('');
  return `<div class="cd-head"><span class="cd-date">${esc(dayLbl)}</span><button type="button" class="cd-close" aria-label="Close">×</button></div>${head}${note}${rows ? `<div class="cd-moves">${rows}</div>` : ''}`;
}

function calSelect(key){
  const root = $('calendar');
  const prev = CAL.sel;
  root.querySelectorAll('.cal-detail').forEach(x => { x.hidden = true; x.innerHTML = ''; });
  root.querySelectorAll('.cal-day.sel').forEach(x => x.classList.remove('sel'));
  root.querySelectorAll('.cal-rib.on').forEach(x => x.classList.remove('on'));
  if(!key || key === prev){ CAL.sel = null; return; }
  const m = CAL.days.get(key);
  const tile = root.querySelector(`.cal-day[data-key="${key}"]`);
  if(!m || !tile) return;
  CAL.sel = key;
  tile.classList.add('sel');
  root.querySelectorAll('.cal-rib').forEach(r => { if(r.dataset.a <= key && key <= r.dataset.b) r.classList.add('on'); });
  const det = tile.closest('.cal-week').querySelector('.cal-detail');
  det.style.setProperty('--col', tile.dataset.col);
  det.innerHTML = calDetailHtml(m);
  det.hidden = false;
  det.scrollIntoView({ block:'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
}

function renderMap(legs){
  const cities = legs.filter(l => l.type !== 'transit' && l.lat && l.lng);
  const wrap = $('mapWrap');
  if(!cities.length || typeof L === 'undefined'){ wrap.hidden = true; return; }
  wrap.hidden = false;

  const map = L.map('map', { scrollWheelZoom:false });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a>',
    maxZoom: 19
  }).addTo(map);

  const latlngs = cities.map(c => [c.lat, c.lng]);
  L.polyline(latlngs, { color:'#1E2126', weight:2, opacity:.45, dashArray:'1 8', lineCap:'round' }).addTo(map);

  cities.forEach((c,i) => {
    const icon = L.divIcon({ className:'', html:`<div class="map-pin">${i+1}</div>`, iconSize:[26,26], iconAnchor:[13,13] });
    const img = c.image ? `<img src="${esc(resizeImg(c.image,320,180))}" alt="">` : '';
    L.marker([c.lat,c.lng], { icon }).addTo(map)
      .bindPopup(`<div class="map-popup">${img}<strong>${esc(c.title)}</strong><span>${esc(dateRange(c.start,c.end))}</span></div>`);
  });

  map.fitBounds(latlngs, { padding:[28,28] });
}

function spotBucket(category){
  const c = (category||'').toLowerCase();
  if(c === 'eat') return 'Eat';
  if(c === 'see') return 'See';
  return 'Do';
}
function groupSpotsByCategory(spots){
  const order = ['Eat','See','Do'];
  const groups = {};
  spots.forEach(s => {
    const bucket = spotBucket(s.category);
    (groups[bucket] = groups[bucket] || []).push(s);
  });
  return order.filter(cat => groups[cat]).map(cat => ({ cat, items: groups[cat] }));
}

function miniPopupHtml(p){
  const n = p.kind === 'bed' ? nights(p.start,p.end) : 0;
  const priceTxt = typeof p.priceAud === 'number'
    ? (n ? `${money(p.priceAud)}/night` : money(p.priceAud))
    : '';
  const statusTxt = p.status ? statusInfo(p.status).label : '';
  const img = p.image ? `<img src="${esc(resizeImg(p.image,260,108))}" alt="">` : '';
  const meta = [p.label, priceTxt, statusTxt].filter(Boolean).join(' · ');
  return `<div class="mini-popup">${img}<a href="#${esc(p.anchor)}"><strong>${esc(p.title)}</strong></a>${meta ? `<span>${esc(meta)}</span>` : ''}</div>`;
}

function addLocateControl(map, pointLatLngs){
  const control = L.control({ position: 'topright' });
  control.onAdd = function(){
    const div = L.DomUtil.create('div', 'leaflet-bar mini-locate');
    div.innerHTML = `<a href="#" title="Show my location" role="button" aria-label="Show my location">${svgIcon('locate',15)}</a>`;
    L.DomEvent.disableClickPropagation(div);
    L.DomEvent.on(div, 'click', e => {
      e.preventDefault();
      if(!navigator.geolocation) return;
      div.classList.add('loading');
      navigator.geolocation.getCurrentPosition(pos => {
        div.classList.remove('loading');
        const { latitude, longitude } = pos.coords;
        const icon = L.divIcon({ className:'', html:`<div class="mini-pin you"></div>`, iconSize:[18,18], iconAnchor:[9,9] });
        if(map._youMarker) map._youMarker.setLatLng([latitude, longitude]);
        else map._youMarker = L.marker([latitude, longitude], { icon }).addTo(map).bindPopup('You are here');
        map.fitBounds([...pointLatLngs, [latitude, longitude]], { padding:[26,26], maxZoom:16 });
      }, () => { div.classList.remove('loading'); }, { enableHighAccuracy:true, timeout:8000 });
    });
    return div;
  };
  control.addTo(map);
}

function renderLegMiniMap(el, leg){
  if(!el || typeof L === 'undefined') return;
  const stay = (leg.stays||[])[0];
  const points = [];
  if(stay){
    const lat = stay.lat || leg.lat, lng = stay.lng || leg.lng;
    if(lat && lng) points.push({ lat, lng, title: stay.title, kind:'bed', anchor:`item-${stay.id}`,
      label:'Stay', priceAud: stay.priceAud, start: stay.start, end: stay.end, status: stay.status, image: stay.image });
  }
  (leg.spots||[]).forEach(s => {
    if(s.lat && s.lng) points.push({ lat:s.lat, lng:s.lng, title:s.title, kind:iconForCategory(s.category), anchor:`item-${s.id}`,
      label: s.category || 'See', priceAud: s.priceAud, status: s.status, image: s.image });
  });
  if(points.length < 2){ el.style.display = 'none'; return; }

  const map = L.map(el, { scrollWheelZoom:false });
  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; <a href="https://www.esri.com" target="_blank" rel="noopener">Esri</a>',
    maxZoom: 19
  }).addTo(map);

  points.forEach(p => {
    const icon = L.divIcon({ className:'', html:`<div class="mini-pin ${p.kind==='bed'?'stay':''}">${svgIcon(p.kind,11)}</div>`, iconSize:[22,22], iconAnchor:[11,11] });
    L.marker([p.lat,p.lng], { icon }).addTo(map).bindPopup(miniPopupHtml(p));
  });
  const latlngs = points.map(p => [p.lat,p.lng]);
  map.fitBounds(latlngs, { padding:[26,26], maxZoom:16 });
  addLocateControl(map, latlngs);
}

function budgetItemHtml(title, cost, href, status, city){
  const hasCost = typeof cost === 'number';
  const booked = status === 'booked';
  const costText = hasCost ? (booked ? money(cost) : '~'+money(cost)) : 'not priced';
  return `<div class="budget-item">
    <a href="#${esc(href)}">${city ? `<span class="city">${esc(city)}</span>` : ''}${esc(title)}${hasCost && !booked ? '<span class="rough-tag">rough</span>' : ''}</a>
    <span class="cost ${hasCost ? (booked?'booked':'') : 'unset'}">${costText}</span>
  </div>`;
}

function budgetGroupHtml(icon, label, actual, target, items, note){
  const hasTarget = typeof target === 'number' && target > 0;
  const pct = hasTarget ? Math.min(150, (actual/target)*100) : 0;
  const fillClass = pct > 100 ? 'over' : (pct > 90 ? 'warn' : '');
  const figs = hasTarget
    ? `${money(actual)} <span class="${actual>target?'over':''}">of ${money(target)}</span>`
    : `${money(actual)} spent · no budget set`;
  return `<div class="budget-row">
    <div class="hd"><span class="cat">${svgIcon(icon,15)}${esc(label)}</span><span class="figs">${figs}</span></div>
    <div class="budget-bar"><div class="fill ${fillClass}" style="width:${hasTarget ? Math.min(100,pct) : 0}%"></div></div>
    ${note ? `<p class="note">${note}</p>` : ''}
    ${items ? `<div class="budget-items">${items}</div>` : ''}
  </div>`;
}

// Flight prices are entered per person; accommodation, food and activity
// prices are entered as the shared/total cost for the whole group.
function renderBudget(trip, legs, view){
  const b = trip.budget || {};
  const travellers = trip.travellers || 1;
  const perPerson = view === 'person';
  const stays = legs.flatMap(l => (l.stays || []).map(s => ({...s, city: l.title})));
  const spots = legs.flatMap(l => l.spots || []);
  const flightLegs = legs.filter(l => l.type === 'transit' && (l.mode||'').toLowerCase()==='flight');

  const flightsPerPerson = flightLegs.reduce((s,x) => s + (x.priceAud||0), 0);
  const accomShared = stays.reduce((s,x) => s + ((x.priceAud||0) * (nights(x.start,x.end)||0)), 0);
  const foodShared = spots.filter(s => (s.category||'').toLowerCase()==='eat').reduce((s,x) => s + (x.priceAud||0), 0);
  const activitiesShared = spots.filter(s => (s.category||'').toLowerCase()!=='eat').reduce((s,x) => s + (x.priceAud||0), 0);

  const flights = perPerson ? flightsPerPerson : flightsPerPerson * travellers;
  const accom = perPerson ? accomShared / travellers : accomShared;
  const food = perPerson ? foodShared / travellers : foodShared;
  const activities = perPerson ? activitiesShared / travellers : activitiesShared;

  const targetOf = k => perPerson ? (b[k]||0) / travellers : (b[k]||0);

  const totalActual = flights + accom + food + activities;
  const totalTarget = ['flights','accom','food','activities'].reduce((s,k) => s + targetOf(k), 0);

  const groupLastLeg = {};
  flightLegs.forEach(f => { groupLastLeg[ANCHOR_MAP[f.id] || f.id] = f; });
  const flightLabel = f => {
    const last = groupLastLeg[ANCHOR_MAP[f.id] || f.id];
    if(!last || last.id === f.id) return f.title;
    const origin = f.title.split(/ to /i)[0];
    const dest = last.title.split(/ to /i).slice(-1)[0];
    return `${origin} to ${dest}`;
  };
  const flightItems = flightLegs
    .filter(f => typeof f.priceAud === 'number' || !f.group || ANCHOR_MAP[f.id] === f.id)
    .map(f => {
      const cost = typeof f.priceAud === 'number' ? (perPerson ? f.priceAud : f.priceAud * travellers) : undefined;
      return budgetItemHtml(flightLabel(f), cost, `leg-${ANCHOR_MAP[f.id]||f.id}`, f.status);
    }).join('');

  const accomItems = stays.map(s => {
    const shared = (s.priceAud||0) * (nights(s.start,s.end)||0);
    const cost = typeof s.priceAud === 'number' ? (perPerson ? shared/travellers : shared) : undefined;
    return budgetItemHtml(s.title, cost, `item-${s.id}`, s.status, s.city);
  }).join('');
  const accomBooked = stays.filter(s => s.status === 'booked')
    .reduce((s,x) => s + (x.priceAud||0) * (nights(x.start,x.end)||0), 0);
  const accomIndicative = accomShared - accomBooked;
  const accomNote = accomShared > 0
    ? `${money(perPerson ? accomBooked/travellers : accomBooked)} booked · ${money(perPerson ? accomIndicative/travellers : accomIndicative)} indicative until booked`
    : '';

  const rows = budgetGroupHtml('plane', 'Flights', flights, targetOf('flights'), flightItems)
    + budgetGroupHtml('bed', 'Accommodation', accom, targetOf('accom'), accomItems, accomNote)
    + budgetGroupHtml('eat', 'Food', food, targetOf('food'))
    + budgetGroupHtml('see', 'Activities', activities, targetOf('activities'));

  const total = `<div class="budget-total">
    <span class="cat">Total</span>
    <span class="figs">${totalTarget ? `${money(totalActual)} of ${money(totalTarget)}` : `${money(totalActual)} spent`}</span>
  </div>`;

  return rows + total;
}

function animateCount(el, target){
  if(reduceMotion()){ el.textContent = target; return; }
  const start = performance.now();
  const dur = 500;
  function step(now){
    const p = Math.min(1, (now-start)/dur);
    el.textContent = Math.round(p*target);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function render(data){
  const t = data.trip || {};
  document.title = t.title || 'Itinerary';
  $('title').textContent = t.title || '';
  $('dateStrip').textContent = t.depart ? `${dateLong(t.depart)} – ${dateLong(t.return)}` : '';

  const legs = (data.legs || []);
  const cities = legs.filter(l => l.type !== 'transit');
  const totalNights = cities.reduce((s,l) => s + nights(l.start,l.end), 0);
  ANCHOR_MAP = computeAnchorMap(legs);

  $('photoStrip').innerHTML = cities.map((c,i) => `
    <a href="#leg-${esc(c.id)}" style="animation-delay:${Math.min(i*50,300)}ms">
      <span class="ph">${c.image ? `<img src="${esc(resizeImg(c.image,160,160))}" alt="" loading="lazy">` : ''}</span>
      <span class="lbl">${esc(c.title)}</span>
    </a>`).join('');

  $('summary').innerHTML = `
    <div>Cities<b>${cities.length}</b></div>
    <div>Nights<b>${totalNights}</b></div>`;

  // now-mode
  const today = new Date(); today.setHours(0,0,0,0);
  const dep = t.depart ? d(t.depart) : null;
  const current = cities.find(l => today >= d(l.start) && today < d(l.end));
  const bar = $('statusBar');
  if(current){
    bar.hidden = false; bar.classList.add('live');
    const left = Math.max(0, Math.round((d(current.end)-today)/86400000));
    $('statusNum').textContent = current.title;
    $('statusLbl').textContent = `now · ${left} night${left===1?'':'s'} to go`;
  } else if(dep && today < dep){
    bar.hidden = false;
    const days = Math.round((dep-today)/86400000);
    $('statusLbl').textContent = `day${days===1?'':'s'} until ${cities[0] ? cities[0].title : 'departure'}`;
    animateCount($('statusNum'), days);
  }

  // calendar
  const calHtml = renderCalendar(t, legs);
  if(calHtml){
    $('calendarWrap').hidden = false;
    $('calendar').innerHTML = calHtml;
    calVerifyPhotos();
    fitCalLabels();
    if(document.fonts){ document.fonts.ready.then(fitCalLabels); document.fonts.addEventListener('loadingdone', fitCalLabels); }
  }

  // route map
  renderMap(legs);

  // budget
  $('budgetWrap').hidden = false;
  let budgetView = 'together';
  $('budgetRows').innerHTML = renderBudget(t, legs, budgetView);
  if((t.travellers||1) > 1){
    const toggle = $('budgetViewToggle');
    toggle.hidden = false;
    const buttons = toggle.querySelectorAll('button');
    const syncButtons = () => buttons.forEach(btn => btn.classList.toggle('active', btn.dataset.view===budgetView));
    syncButtons();
    buttons.forEach(btn => btn.addEventListener('click', () => {
      budgetView = btn.dataset.view;
      syncButtons();
      $('budgetRows').innerHTML = renderBudget(t, legs, budgetView);
    }));
  }

  const parts = [];
  const miniMapTargets = [];
  let cityIdx = 0;
  for(let i=0;i<legs.length;i++){
    const l = legs[i];
    const delay = Math.min(i*50, 400);

    if(l.type === 'transit'){
      if(l.group && legs[i+1] && legs[i+1].type === 'transit' && legs[i+1].group === l.group){
        const members = [l];
        let j = i+1;
        while(j<legs.length && legs[j].type==='transit' && legs[j].group===l.group){ members.push(legs[j]); j++; }
        const segs = members.map((m,idx) =>
          transitInner(m) + (idx < members.length-1 ? connectorHtml(m, members[idx+1]) : '')
        ).join('');
        parts.push(`<section class="transit-group" id="leg-${esc(l.id)}" style="animation-delay:${delay}ms">
          <p class="group-label">${esc(l.group)}</p>
          ${segs}
        </section>`);
        i = j-1;
        continue;
      }
      parts.push(transitInner(l, 'standalone', `leg-${esc(l.id)}`, `animation-delay:${delay}ms`));
      continue;
    }

    cityIdx++;
    const n = nights(l.start,l.end);
    const isNow = current && current.id === l.id;
    const lt = l.tz ? localTime(l.tz) : null;
    const staysHtml = (l.stays||[]).map(s => itemCard(s,'stay',l.title,true)).join('');
    const spotGroups = groupSpotsByCategory(l.spots||[]);
    const spotsHtml = spotGroups.map(g => `
        <p class="subgrp-label">${svgIcon(g.cat.toLowerCase(),13)}${esc(g.cat)}</p>
        <div class="card-grid">${g.items.map(s => itemCard(s,'spot',l.title)).join('')}</div>
      `).join('');
    const mapId = `legmap-${esc(l.id)}`;
    const legAccom = (l.stays||[]).reduce((s,x) => s + ((x.priceAud||0) * (nights(x.start,x.end)||0)), 0);
    const media = l.image
      ? `<img src="${esc(resizeImg(l.image,2200,1600))}" alt="" loading="lazy">`
      : `<div class="mono">${esc(initial(l.title))}</div>`;

    if(spotGroups.length) miniMapTargets.push(l);

    parts.push(`<section class="leg-card ${isNow?'now':''}" id="leg-${esc(l.id)}" data-id="${esc(l.id)}" style="animation-delay:${delay}ms">
      <div class="leg-media">
        ${media}
        <span class="leg-index">${String(cityIdx).padStart(2,'0')} / ${String(cities.length).padStart(2,'0')}</span>
        ${isNow ? `<span class="now-badge">Now</span>` : ''}
      </div>
      <div class="leg-content">
        <div class="leg-summary">
          <h2>${esc(l.title)}</h2>
          <div class="leg-stats">
            <div class="stat"><span class="v">${dateRange(l.start,l.end)}</span><span class="k">Dates</span></div>
            <div class="stat"><span class="v">${n}</span><span class="k">Night${n===1?'':'s'}</span></div>
          </div>
          ${lt ? `<p class="localtime">Local time ${lt}</p>` : ''}
          ${legAccom ? `<p class="spend">${svgIcon('bed',13)}${money(legAccom)} accommodation</p>` : ''}
          ${l.body ? `<p class="body-text">${esc(l.body)}</p>` : ''}
        </div>
        ${staysHtml ? `<p class="grp-label">Sleeping</p>${staysHtml}` : ''}
        ${spotsHtml ? `<p class="grp-label">Eat, see, do</p><div class="mini-map" id="${mapId}"></div>${spotsHtml}` : ''}
        <div class="row"><a class="lnk" href="${mapLink(l)}" target="_blank" rel="noopener">Open in Maps</a></div>
      </div>
    </section>`);
  }
  $('timeline').innerHTML = parts.join('');

  if(miniMapTargets.length && typeof L !== 'undefined'){
    const io = new IntersectionObserver((entries, obs) => {
      entries.forEach(entry => {
        if(!entry.isIntersecting) return;
        const leg = miniMapTargets.find(l => `legmap-${l.id}` === entry.target.id);
        if(leg) renderLegMiniMap(entry.target, leg);
        obs.unobserve(entry.target);
      });
    }, { rootMargin: '200px' });
    miniMapTargets.forEach(l => {
      const el = document.getElementById(`legmap-${l.id}`);
      if(el) io.observe(el);
    });
  }

  $('footer').innerHTML = `${cities.length} cities · ${totalNights} nights · ${t.travellers||2} travelling.
    Prices are estimates, not quotes. Edit <code>trip.json</code> and push to update.`;

  if(current){
    const el = document.querySelector('.leg-card.now');
    if(el) el.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'start'});
  }
}

async function boot(){
  let data = null;
  try{
    const res = await fetch('trip.json?_=' + Date.now());
    if(!res.ok) throw new Error(res.status);
    data = await res.json();
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){}
  }catch(err){
    try{
      const cached = localStorage.getItem(CACHE_KEY);
      if(cached) data = JSON.parse(cached);
    }catch(e){}
  }

  if(!data){
    $('title').textContent = 'No data yet';
    $('timeline').innerHTML = `<div class="err">
      Couldn't load <code>trip.json</code>. If you opened this file directly from Finder,
      the browser blocks the request. Serve the folder instead:
      <br><br><code>python3 -m http.server 8000</code><br><br>
      then open <code>localhost:8000</code>. On Netlify it just works.
    </div>`;
    return;
  }
  render(data);
}

$('calendar').addEventListener('click', e => {
  if(e.target.closest('.cd-close')){ calSelect(null); return; }
  const b = e.target.closest('[data-key]');
  if(b) calSelect(b.dataset.key);
});
document.addEventListener('keydown', e => { if(e.key === 'Escape' && CAL.sel) calSelect(null); });
let calResizeT;
window.addEventListener('resize', () => { clearTimeout(calResizeT); calResizeT = setTimeout(fitCalLabels, 150); });
document.addEventListener('scroll', e => {
  const gallery = e.target.closest && e.target.closest('.ic-gallery');
  if(!gallery) return;
  const idx = Math.round(gallery.scrollLeft / gallery.clientWidth);
  const dots = gallery.parentElement.querySelectorAll('.ic-dots span');
  dots.forEach((d,i) => d.classList.toggle('active', i===idx));
}, true);

boot();
</script>
