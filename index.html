<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6F3EC">
<title>Japan &amp; Vietnam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&family=Archivo:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<style>
:root{
  --bg:#F6F3EC;
  --surface:#FFFFFF;
  --text:#1E2126;
  --muted:#5B6472;
  --faint:#8B93A1;
  --line:#E4DFD3;
  --line-2:#D8D1C0;

  --good:#1F6B47;
  --warn:#B0691F;
  --bad:#A33723;

  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',monospace;

  --radius:12px;
  --gutter:22px;
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);
  color:var(--text);
  font-family:'Archivo',system-ui,-apple-system,sans-serif;
  font-size:16px;
  line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:64px;
}
.wrap{max-width:1080px;margin:0 auto;padding:0 var(--gutter)}
img{max-width:100%;display:block}
svg{display:block;flex:none}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- masthead ---------- */
.masthead{padding:44px 0 28px}
.photostrip{display:flex;gap:10px;overflow-x:auto;margin:0 0 22px;padding-bottom:2px}
.photostrip a{
  flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:6px;
  text-decoration:none;width:72px;animation:rise .5s ease both;
}
.photostrip .ph{width:72px;height:72px;border-radius:14px;overflow:hidden;background:var(--line);border:1px solid var(--line-2)}
.photostrip .ph img{width:100%;height:100%;object-fit:cover}
.photostrip .lbl{
  font-size:9.5px;letter-spacing:.04em;color:var(--muted);text-align:center;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:72px;
}
.masthead h1{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'SOFT' 30,'WONK' 1,'opsz' 100;
  font-weight:500;font-size:clamp(38px,7vw,58px);
  line-height:.98;letter-spacing:-.02em;margin:0;color:var(--text);
}
.datestrip{
  font-family:var(--mono);font-size:14px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--muted);margin:14px 0 0;font-variant-numeric:tabular-nums;
}

/* ---------- countdown ---------- */
.status-bar{
  margin:26px 0 0;padding:16px 18px;
  border:1px solid var(--line);border-radius:var(--radius);
  background:var(--surface);
  display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;position:relative;
}
.status-bar .n{
  font-family:'Fraunces',Georgia,serif;font-weight:600;
  font-size:32px;line-height:1;font-variant-numeric:tabular-nums;color:var(--text);
}
.status-bar .lbl{font-size:13px;color:var(--muted);letter-spacing:.02em;display:flex;align-items:center;gap:7px}
.status-bar .lbl::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--line-2)}
.status-bar.live{border-color:var(--text);box-shadow:0 0 0 1px var(--text) inset}
.status-bar.live .lbl::before{background:var(--good);animation:pulse 1.8s ease-in-out infinite}

/* ---------- summary ---------- */
.summary{
  display:flex;gap:28px;margin:20px 0 6px;flex-wrap:wrap;
  font-size:12px;color:var(--faint);
  letter-spacing:.1em;text-transform:uppercase;font-weight:600;
}
.summary b{
  display:block;font-family:'Fraunces',Georgia,serif;font-weight:500;
  font-size:22px;color:var(--text);letter-spacing:normal;
  text-transform:none;font-variant-numeric:tabular-nums;
}

/* ---------- calendar grid ---------- */
.calendar{margin-top:36px}
.section-label{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);font-weight:600;margin:0 0 14px;
}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;width:100%}
.cal-dow{font-size:9.5px;text-transform:uppercase;color:var(--faint);text-align:center;padding-bottom:3px;font-weight:600;letter-spacing:.04em}
.cal-cell{
  aspect-ratio:1;border-radius:7px;position:relative;overflow:hidden;
  background:var(--bg);background-size:cover;background-position:center;
}
.cal-cell.blank{background:transparent}
.cal-cell .num{
  position:absolute;top:4px;left:4px;font-family:var(--mono);font-size:10.5px;font-weight:600;
  color:#fff;background:rgba(30,33,38,.55);padding:2px 5px;border-radius:5px;line-height:1;
  font-variant-numeric:tabular-nums;
}
.cal-cell.transit .num{color:var(--text);background:rgba(255,255,255,.7)}
.cal-cell .modeicon{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);
}
.cal-cell .daypill{
  position:absolute;left:3px;right:3px;bottom:3px;display:flex;align-items:center;gap:3px;
  background:rgba(30,33,38,.65);color:#fff;
  font-family:var(--mono);font-size:clamp(6px,1.3vw,8.5px);font-weight:600;
  padding:2px 5px;border-radius:20px;line-height:1.5;
  white-space:nowrap;overflow:hidden;
}
.cal-cell.transit .daypill{background:rgba(255,255,255,.85);color:var(--text)}
.cal-cell .daypill svg{flex:none}
.cal-cell .daypill span{overflow:hidden;text-overflow:ellipsis}
.cal-cell.today{box-shadow:0 0 0 2px var(--text)}

/* ---------- map ---------- */
.mapSection{margin-top:36px}
.map{height:420px;border-radius:var(--radius);overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.map-pin{
  width:26px;height:26px;border-radius:50%;background:var(--text);color:#fff;
  display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:11px;font-weight:600;
  border:2px solid #fff;box-shadow:0 1px 5px rgba(30,33,38,.35);
}
.leaflet-popup-content-wrapper{border-radius:10px}
.leaflet-popup-content{margin:12px 14px;font-family:'Archivo',sans-serif}
.map-popup img{width:100%;border-radius:8px;margin-bottom:8px;aspect-ratio:16/10;object-fit:cover}
.map-popup strong{font-family:'Fraunces',Georgia,serif;font-size:16px;font-weight:500}
.map-popup span{display:block;font-size:12px;color:var(--muted);margin-top:2px;font-family:var(--mono)}

/* ---------- budget ---------- */
.budget{margin-top:36px;max-width:640px}
.budget-row{margin-bottom:16px}
.budget-row .hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:6px}
.budget-row .cat{display:flex;align-items:center;gap:7px;font-size:14px;font-weight:600;color:var(--text)}
.budget-row .figs{font-family:var(--mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.budget-row .figs .over{color:var(--bad);font-weight:600}
.budget-bar{height:7px;border-radius:20px;background:var(--line);overflow:hidden}
.budget-bar .fill{height:100%;border-radius:20px;background:var(--good)}
.budget-bar .fill.warn{background:var(--warn)}
.budget-bar .fill.over{background:var(--bad)}
.budget-total{
  display:flex;justify-content:space-between;align-items:baseline;
  margin-top:18px;padding-top:14px;border-top:1px solid var(--line);
  font-size:14px;
}
.budget-total .cat{font-weight:600;color:var(--text)}
.budget-total .figs{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}

/* ---------- leg grid ---------- */
.legs{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:22px;margin-top:40px}

.transit-row{
  display:flex;gap:14px;align-items:center;flex-wrap:wrap;
  padding:14px 18px;background:var(--surface);
  border-left:4px solid var(--line-2);
}
.transit-row.standalone{
  grid-column:1/-1;border:1px solid var(--line);border-left-width:4px;
  border-radius:var(--radius);animation:rise .5s ease both;
}
.t-icon{width:38px;height:38px;border-radius:10px;flex:none;display:flex;align-items:center;justify-content:center}
.transit-row .body{min-width:0;flex:1 1 220px}
.transit-row .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.transit-row .t{color:var(--text);font-size:14.5px;font-weight:600;margin:0}
.transit-row .sub{font-size:12.5px;color:var(--muted);margin:5px 0 0}
.transit-row .d{color:var(--muted);font-size:13.5px;margin:6px 0 0;line-height:1.5}
.board{flex:none;margin-left:auto;text-align:right}
.board .route{
  font-family:var(--mono);font-size:19px;font-weight:600;color:var(--text);
  letter-spacing:.02em;font-variant-numeric:tabular-nums;
  display:flex;align-items:center;gap:7px;justify-content:flex-end;
}
.board .route .arrow{color:var(--faint);font-size:14px}
.board .time{font-family:var(--mono);font-size:12.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.board .dur{font-family:var(--mono);font-size:11px;color:var(--faint);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}

/* connecting-flight / linked-transit group */
.transit-group{
  grid-column:1/-1;background:var(--surface);border:1px solid var(--line);
  border-radius:var(--radius);overflow:hidden;animation:rise .5s ease both;
}
.transit-group .group-label{
  font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);
  font-weight:700;margin:0;padding:13px 18px 0;
}
.transit-group .transit-row+.transit-row{border-top:1px dashed var(--line)}
.connector{
  display:flex;align-items:center;gap:8px;padding:7px 18px 7px 56px;
  font-family:var(--mono);font-size:10.5px;color:var(--faint);
  letter-spacing:.05em;text-transform:uppercase;background:var(--bg);
}

.leg-card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  overflow:hidden;display:flex;flex-direction:column;
  animation:rise .5s ease both;
}
.leg-card.now{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}

.leg-media{
  aspect-ratio:16/9;position:relative;
  background:linear-gradient(155deg,#EDEAE1,#F8F6F0);
}
.leg-media img{width:100%;height:100%;object-fit:cover}
.leg-media .mono{
  position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  font-family:'Fraunces',Georgia,serif;font-size:52px;color:rgba(30,33,38,.14);
}
.leg-media .now-badge{
  position:absolute;top:12px;left:12px;background:var(--text);color:var(--surface);
  font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;
  padding:5px 9px;border-radius:20px;display:flex;align-items:center;gap:6px;
}
.leg-media .now-badge::before{content:'';width:6px;height:6px;border-radius:50%;background:currentColor;animation:pulse 1.8s ease-in-out infinite}

.leg-content{padding:18px 20px 20px}
.leg-card h2{
  font-family:'Fraunces',Georgia,serif;
  font-variation-settings:'SOFT' 30,'WONK' 1,'opsz' 40;
  font-weight:500;font-size:27px;line-height:1.08;margin:0;
  letter-spacing:-.01em;color:var(--text);
}
.leg-stats{display:flex;gap:26px;margin-top:14px}
.leg-stats .stat{display:flex;flex-direction:column}
.leg-stats .v{font-family:var(--mono);font-size:19px;font-weight:600;color:var(--text);font-variant-numeric:tabular-nums;line-height:1.15}
.leg-stats .k{font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin-top:3px}
.localtime{
  font-family:var(--mono);font-size:12px;color:var(--faint);letter-spacing:.02em;
  margin:12px 0 0;font-variant-numeric:tabular-nums;
}
.spend{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:13px;color:var(--text);margin-top:10px;font-variant-numeric:tabular-nums}
.leg-content>p.body-text{color:var(--muted);font-size:14.5px;margin:12px 0 0;line-height:1.6}

.grp-label{
  font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--faint);font-weight:600;margin:20px 0 8px;
}
.item{display:flex;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:none}
.item .thumb{
  width:52px;height:52px;border-radius:10px;flex:0 0 52px;overflow:hidden;
  background:var(--line);color:var(--muted);
  display:flex;align-items:center;justify-content:center;
}
.item .thumb img{width:100%;height:100%;object-fit:cover}
.item .info{flex:1;min-width:0}
.item h3{font-size:15px;font-weight:600;margin:0;letter-spacing:-.005em;color:var(--text)}
.item .meta{font-size:12.5px;color:var(--muted);margin:2px 0 0}
.item p{font-size:13.5px;color:var(--muted);margin:6px 0 0;line-height:1.55}
.item .row{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:8px}

a.lnk{
  color:var(--text);font-size:12px;text-decoration:none;
  border-bottom:1px solid var(--line-2);padding-bottom:2px;
}
a.lnk:hover{border-color:var(--text)}
.pill{
  display:inline-flex;align-items:center;gap:4px;
  font-size:10px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;
  padding:4px 9px;border-radius:20px;border:1px solid transparent;
}
.price{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}

.leg-content>.row{margin-top:16px}

/* footer */
footer{
  margin:52px 0 0;padding-top:22px;border-top:1px solid var(--line);
  font-size:12.5px;color:var(--faint);line-height:1.6;
}
.err{
  border:1px solid var(--line);border-left:3px solid var(--warn);
  padding:16px 18px;margin:30px 0;color:var(--muted);font-size:14.5px;
  background:var(--surface);border-radius:var(--radius);
}
.err code{
  font-family:ui-monospace,monospace;font-size:13px;
  background:var(--bg);padding:2px 5px;border-radius:2px;color:var(--text);
}
:focus-visible{outline:2px solid var(--text);outline-offset:3px}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <div class="photostrip" id="photoStrip"></div>
    <h1 id="title">Loading</h1>
    <p class="datestrip" id="dateStrip"></p>
    <div class="status-bar" id="statusBar" hidden>
      <span class="n" id="statusNum"></span>
      <span class="lbl" id="statusLbl"></span>
    </div>
    <div class="summary" id="summary"></div>
  </header>
  <section class="calendar" id="calendarWrap" hidden>
    <p class="section-label">At a glance</p>
    <div class="cal-grid" id="calendar"></div>
  </section>
  <section class="mapSection" id="mapWrap" hidden>
    <p class="section-label">Route</p>
    <div class="map" id="map"></div>
  </section>
  <section class="budget" id="budgetWrap" hidden>
    <p class="section-label">Budget</p>
    <div id="budgetRows"></div>
  </section>
  <main class="legs" id="timeline"></main>
  <footer id="footer"></footer>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script>
const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const CACHE_KEY = 'trip-cache-v1';

const ICONS = {
  plane: '<path d="M22 2 11 13"/><path d="M22 2 15 22 11 13 2 9 22 2Z"/>',
  train: '<rect x="5" y="3" width="14" height="12" rx="4"/><path d="M5 10h14"/><circle cx="8.5" cy="17.5" r="1.5"/><circle cx="15.5" cy="17.5" r="1.5"/><path d="M7 19l-2 3"/><path d="M17 19l2 3"/>',
  car: '<path d="M5 11l1.6-4.6A2 2 0 0 1 8.5 5h7a2 2 0 0 1 1.9 1.4L19 11"/><rect x="3" y="11" width="18" height="6" rx="2"/><circle cx="7.5" cy="17.5" r="1.5"/><circle cx="16.5" cy="17.5" r="1.5"/>',
  bus: '<rect x="4" y="4" width="16" height="12" rx="2"/><path d="M4 11h16"/><path d="M8 4v7"/><path d="M16 4v7"/><circle cx="7.5" cy="19" r="1.5"/><circle cx="16.5" cy="19" r="1.5"/>',
  boat: '<path d="M2 20l1.6-4.5h16.8L22 20"/><path d="M4.5 15.5l1-9h5l1 9"/><path d="M12 3v3.5"/>',
  walk: '<circle cx="13" cy="4" r="2"/><path d="M9 22l1.6-7L8 13l1-5 4-1 3 3 3 1"/><path d="M10.5 15l3 1 2 6"/>',
  bed: '<path d="M3 18v-7a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v3"/><path d="M12 14v-2a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v6"/><path d="M3 18h18"/><path d="M3 11V6"/>',
  eat: '<path d="M6 2v7a3 3 0 0 0 6 0V2"/><path d="M9 9v13"/><path d="M17 2v9"/><path d="M17 11a2 2 0 0 0 2-2V2"/><path d="M17 11v11"/>',
  see: '<path d="M1 12S5 5 12 5s11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/>',
  shop: '<path d="M6 8h12l-1.2 12.2a2 2 0 0 1-2 1.8H9.2a2 2 0 0 1-2-1.8L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
  drink: '<path d="M5 3h14l-1.6 15.2a2 2 0 0 1-2 1.8H8.6a2 2 0 0 1-2-1.8L5 3Z"/><path d="M6.5 8h11"/>',
  idea: '<path d="M9 18h6"/><path d="M10 21.5h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1v.2h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2Z"/>',
  shortlist: '<path d="M6 3h12v18l-6-4-6 4V3Z"/>',
  held: '<circle cx="12" cy="12" r="9"/><path d="M12 7.5v5l3.5 2"/>',
  booked: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.5 2.5L16 9"/>',
  pin: '<path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12Z"/><circle cx="12" cy="9" r="2.4"/>'
};

const STATUS = {
  idea:      { c:'#5B6472', bg:'#F1EFEA', bd:'#D8D1C0', label:'Idea',      icon:'idea' },
  shortlist: { c:'#2E5E8C', bg:'#EDF4FA', bd:'#B7D2EA', label:'Shortlist', icon:'shortlist' },
  held:      { c:'#8A6A12', bg:'#FBF4E1', bd:'#EAD8A0', label:'Held',      icon:'held' },
  booked:    { c:'#1F6B47', bg:'#E9F7EF', bd:'#B0DDC4', label:'Booked',    icon:'booked' },
};

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const d = s => { const [y,m,dd] = String(s).split('-').map(Number); return new Date(y, m-1, dd); };
const dkey = dt => `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
const nights = (a,b) => (a&&b) ? Math.round((d(b)-d(a))/86400000) : 0;
const initial = s => (s || '?').trim().charAt(0).toUpperCase();
const money = n => '$' + Math.round(n).toLocaleString();
const reduceMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;

function resizeImg(url, w, h){
  if(!url) return url;
  try{
    const u = new URL(url);
    u.searchParams.set('w', w);
    if(h) u.searchParams.set('h', h);
    u.searchParams.set('fit', 'crop');
    u.searchParams.set('crop', 'entropy');
    u.searchParams.set('q', '75');
    u.searchParams.set('auto', 'format');
    return u.toString();
  }catch(e){ return url; }
}

function svgIcon(key, size){
  size = size || 16;
  const inner = ICONS[key] || ICONS.pin;
  return `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${inner}</svg>`;
}

function iconForMode(mode){
  const m = (mode||'').toLowerCase();
  if(m.includes('flight')) return 'plane';
  if(m.includes('train')) return 'train';
  if(m.includes('car')) return 'car';
  if(m.includes('bus')) return 'bus';
  if(m.includes('ferry') || m.includes('boat')) return 'boat';
  return 'walk';
}
function iconForCategory(category){
  const c = (category||'').toLowerCase();
  if(c==='eat') return 'eat';
  if(c==='shop') return 'shop';
  if(c==='drink') return 'drink';
  return 'see';
}
function statusInfo(status){ return STATUS[status] || STATUS.idea; }

function dateRange(a,b){
  if(!a) return '';
  const A = d(a);
  if(!b || a===b) return `${A.getDate()} ${MONTHS[A.getMonth()]}`;
  const B = d(b);
  return A.getMonth()===B.getMonth()
    ? `${A.getDate()}–${B.getDate()} ${MONTHS[B.getMonth()]}`
    : `${A.getDate()} ${MONTHS[A.getMonth()]} – ${B.getDate()} ${MONTHS[B.getMonth()]}`;
}

function dateLong(s){
  if(!s) return '';
  const D = d(s);
  return `${D.getDate()} ${MONTHS[D.getMonth()]} ${D.getFullYear()}`;
}

function localTime(tz){
  try{
    return new Intl.DateTimeFormat('en-AU',{hour:'2-digit',minute:'2-digit',timeZone:tz,hour12:false}).format(new Date());
  }catch(e){ return null; }
}

function mapLink(o){
  if(o.lat && o.lng) return `https://www.google.com/maps/search/?api=1&query=${o.lat},${o.lng}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(o.title)}`;
}

function pill(status){
  if(!status) return '';
  const s = statusInfo(status);
  return `<span class="pill" style="color:${s.c};background:${s.bg};border-color:${s.bd}">${svgIcon(s.icon,11)}${esc(s.label)}</span>`;
}

function timeGapMinutes(t1, t2){
  const [h1,m1] = t1.split(':').map(Number);
  const [h2,m2] = t2.split(':').map(Number);
  let diff = (h2*60+m2) - (h1*60+m1);
  if(diff < 0) diff += 1440;
  return diff;
}

function fmtDur(mins){
  const h = Math.floor(mins/60), m = mins%60;
  return h ? `${h}h${m ? String(m).padStart(2,'0')+'m' : ''}` : `${m}m`;
}

function connectorHtml(a, b){
  if(a.arriveTime && b.departTime){
    const mins = timeGapMinutes(a.arriveTime, b.departTime);
    return `<div class="connector">${fmtDur(mins)} layover${a.to ? ' · '+esc(a.to) : ''}</div>`;
  }
  return `<div class="connector">Then by ${esc((b.mode||'transfer').toLowerCase())}</div>`;
}

function transitInner(l, extraClass, idAttr, styleAttr){
  const s = statusInfo(l.status);
  const hasTimes = l.departTime && l.arriveTime;
  const hasRoute = l.from && l.to;
  return `<div class="transit-row ${extraClass||''}" ${idAttr?`id="${idAttr}"`:''} style="border-left-color:${s.c};${styleAttr||''}">
    <div class="t-icon" style="background:${s.bg};color:${s.c}">${svgIcon(iconForMode(l.mode),20)}</div>
    <div class="body">
      <div class="top">
        <p class="t">${esc(l.title)}</p>
        ${pill(l.status)}
      </div>
      <p class="sub">${esc(l.mode||'Transit')}${l.flightNo ? ' · '+esc(l.flightNo) : ''}${l.priceAud ? ' · '+money(l.priceAud) : ''}</p>
      ${l.body ? `<p class="d">${esc(l.body)}</p>` : ''}
    </div>
    <div class="board">
      ${hasRoute ? `<div class="route">${esc(l.from)}<span class="arrow">→</span>${esc(l.to)}</div>` : ''}
      ${hasTimes ? `<div class="time">${esc(l.departTime)}–${esc(l.arriveTime)}</div>` : ''}
      ${l.duration ? `<div class="dur">${esc(l.duration)}</div>` : ''}
    </div>
  </div>`;
}

function thumb(o, kind){
  if(o.image) return `<div class="thumb"><img src="${esc(resizeImg(o.image,120,120))}" alt="" loading="lazy"></div>`;
  const s = statusInfo(o.status);
  const iconKey = kind === 'stay' ? 'bed' : iconForCategory(o.category);
  return `<div class="thumb" style="background:${s.bg};color:${s.c}">${svgIcon(iconKey,22)}</div>`;
}

function itemRow(o, kind){
  const meta = [o.subtitle, o.category, dateRange(o.start,o.end)].filter(Boolean).join(' · ');
  const n = nights(o.start,o.end);
  const cost = (o.priceAud && n) ? `<span class="price">${money(o.priceAud)}/night · ${money(o.priceAud*n)} total</span>`
             : (o.priceAud ? `<span class="price">${money(o.priceAud)}</span>` : '');
  return `<div class="item">
    ${thumb(o, kind)}
    <div class="info">
      <h3>${esc(o.title)}</h3>
      ${meta ? `<p class="meta">${esc(meta)}</p>` : ''}
      ${o.body ? `<p>${esc(o.body)}</p>` : ''}
      <div class="row">
        ${pill(o.status)}
        ${cost}
        <a class="lnk" href="${mapLink(o)}" target="_blank" rel="noopener">Map</a>
        ${o.url ? `<a class="lnk" href="${esc(o.url)}" target="_blank" rel="noopener">Site</a>` : ''}
      </div>
    </div>
  </div>`;
}

function buildDayMap(legs){
  const map = new Map();
  legs.forEach(item => {
    if(!item.start) return;
    const start = d(item.start);
    const end = item.end ? d(item.end) : start;
    if(end.getTime() <= start.getTime()){
      map.set(dkey(start), item);
    } else {
      const cur = new Date(start);
      while(cur.getTime() < end.getTime()){
        map.set(dkey(cur), item);
        cur.setDate(cur.getDate()+1);
      }
    }
  });
  return map;
}

function dayPillHtml(item, dt){
  if(!item) return '';
  if(item.type === 'transit'){
    if(!item.departTime) return '';
    return `<span class="daypill">${svgIcon(iconForMode(item.mode),9)}<span>${esc(item.departTime)}</span></span>`;
  }
  const stay = (item.stays||[]).find(s => s.start && s.end && dt >= d(s.start) && dt < d(s.end));
  return `<span class="daypill"><span>${esc(item.title)}</span>${stay ? svgIcon('bed',9)+`<span>${esc(stay.title)}</span>` : ''}</span>`;
}

function renderCalendar(trip, legs){
  if(!trip.depart || !trip.return) return '';
  const map = buildDayMap(legs);
  const start = d(trip.depart), end = d(trip.return);
  const today = new Date(); today.setHours(0,0,0,0);
  const todayKey = dkey(today);
  const days = [];
  const cur = new Date(start);
  while(cur.getTime() <= end.getTime()){
    days.push(new Date(cur));
    cur.setDate(cur.getDate()+1);
  }

  const lead = (days[0].getDay()+6)%7;
  const cells = [];
  for(let i=0;i<lead;i++) cells.push('<div class="cal-cell blank"></div>');
  let lastMonth = null;
  days.forEach(dt => {
    const item = map.get(dkey(dt));
    const key = dkey(dt);
    const isTransit = item && item.type === 'transit';
    const isToday = key === todayKey;
    const showMonth = dt.getMonth() !== lastMonth;
    lastMonth = dt.getMonth();

    let dayImage = null;
    if(item && !isTransit){
      const pool = item.images && item.images.length ? item.images : (item.image ? [item.image] : null);
      if(pool){
        const dayIdx = Math.round((dt - d(item.start))/86400000);
        dayImage = pool[dayIdx % pool.length];
      }
    }
    const bg = dayImage ? `style="background-image:url('${resizeImg(dayImage,140,140)}')"` : '';
    const icon = isTransit ? `<span class="modeicon">${svgIcon(iconForMode(item.mode),18)}</span>` : '';
    const numLbl = showMonth ? `${MONTHS[dt.getMonth()]} ${dt.getDate()}` : dt.getDate();
    cells.push(`<div class="cal-cell ${isTransit?'transit':''} ${isToday?'today':''}" title="${esc(item ? item.title : '')}" ${bg}>
      ${icon}
      <span class="num">${numLbl}</span>
      ${dayPillHtml(item, dt)}
    </div>`);
  });

  return `
    <div class="cal-dow">M</div><div class="cal-dow">T</div><div class="cal-dow">W</div><div class="cal-dow">T</div><div class="cal-dow">F</div><div class="cal-dow">S</div><div class="cal-dow">S</div>
    ${cells.join('')}`;
}

function renderMap(legs){
  const cities = legs.filter(l => l.type !== 'transit' && l.lat && l.lng);
  const wrap = $('mapWrap');
  if(!cities.length || typeof L === 'undefined'){ wrap.hidden = true; return; }
  wrap.hidden = false;

  const map = L.map('map', { scrollWheelZoom:false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> &copy; <a href="https://carto.com/attributions" target="_blank" rel="noopener">CARTO</a>',
    maxZoom: 18
  }).addTo(map);

  const latlngs = cities.map(c => [c.lat, c.lng]);
  L.polyline(latlngs, { color:'#1E2126', weight:2, opacity:.45, dashArray:'1 8', lineCap:'round' }).addTo(map);

  cities.forEach((c,i) => {
    const icon = L.divIcon({ className:'', html:`<div class="map-pin">${i+1}</div>`, iconSize:[26,26], iconAnchor:[13,13] });
    const img = c.image ? `<img src="${esc(resizeImg(c.image,320,180))}" alt="">` : '';
    L.marker([c.lat,c.lng], { icon }).addTo(map)
      .bindPopup(`<div class="map-popup">${img}<strong>${esc(c.title)}</strong><span>${esc(dateRange(c.start,c.end))}</span></div>`);
  });

  map.fitBounds(latlngs, { padding:[28,28] });
}

function budgetRowHtml(icon, label, actual, target){
  const hasTarget = typeof target === 'number' && target > 0;
  const pct = hasTarget ? Math.min(150, (actual/target)*100) : 0;
  const fillClass = pct > 100 ? 'over' : (pct > 90 ? 'warn' : '');
  const figs = hasTarget
    ? `${money(actual)} <span class="${actual>target?'over':''}">of ${money(target)}</span>`
    : `${money(actual)} spent · no budget set`;
  return `<div class="budget-row">
    <div class="hd"><span class="cat">${svgIcon(icon,15)}${esc(label)}</span><span class="figs">${figs}</span></div>
    <div class="budget-bar"><div class="fill ${fillClass}" style="width:${hasTarget ? Math.min(100,pct) : 0}%"></div></div>
  </div>`;
}

function renderBudget(trip, legs){
  const b = trip.budget || {};
  const stays = legs.flatMap(l => l.stays || []);
  const spots = legs.flatMap(l => l.spots || []);
  const transits = legs.filter(l => l.type === 'transit');

  const flights = transits.reduce((s,x) => s + (x.priceAud||0), 0);
  const accom = stays.reduce((s,x) => s + ((x.priceAud||0) * (nights(x.start,x.end)||0)), 0);
  const food = spots.filter(s => (s.category||'').toLowerCase()==='eat').reduce((s,x) => s + (x.priceAud||0), 0);
  const activities = spots.filter(s => (s.category||'').toLowerCase()!=='eat').reduce((s,x) => s + (x.priceAud||0), 0);

  const totalActual = flights + accom + food + activities;
  const totalTarget = ['flights','accom','food','activities'].reduce((s,k) => s + (b[k]||0), 0);

  const rows = budgetRowHtml('plane', 'Flights', flights, b.flights)
    + budgetRowHtml('bed', 'Accommodation', accom, b.accom)
    + budgetRowHtml('eat', 'Food', food, b.food)
    + budgetRowHtml('see', 'Activities', activities, b.activities);

  const total = `<div class="budget-total">
    <span class="cat">Total</span>
    <span class="figs">${totalTarget ? `${money(totalActual)} of ${money(totalTarget)}` : `${money(totalActual)} spent`}</span>
  </div>`;

  return rows + total;
}

function animateCount(el, target){
  if(reduceMotion()){ el.textContent = target; return; }
  const start = performance.now();
  const dur = 500;
  function step(now){
    const p = Math.min(1, (now-start)/dur);
    el.textContent = Math.round(p*target);
    if(p<1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function render(data){
  const t = data.trip || {};
  document.title = t.title || 'Itinerary';
  $('title').textContent = t.title || '';
  $('dateStrip').textContent = t.depart ? `${dateLong(t.depart)} – ${dateLong(t.return)}` : '';

  const legs = (data.legs || []);
  const cities = legs.filter(l => l.type !== 'transit');
  const totalNights = cities.reduce((s,l) => s + nights(l.start,l.end), 0);

  $('photoStrip').innerHTML = cities.map((c,i) => `
    <a href="#leg-${esc(c.id)}" style="animation-delay:${Math.min(i*50,300)}ms">
      <span class="ph">${c.image ? `<img src="${esc(resizeImg(c.image,160,160))}" alt="" loading="lazy">` : ''}</span>
      <span class="lbl">${esc(c.title)}</span>
    </a>`).join('');

  $('summary').innerHTML = `
    <div>Cities<b>${cities.length}</b></div>
    <div>Nights<b>${totalNights}</b></div>`;

  // now-mode
  const today = new Date(); today.setHours(0,0,0,0);
  const dep = t.depart ? d(t.depart) : null;
  const current = cities.find(l => today >= d(l.start) && today < d(l.end));
  const bar = $('statusBar');
  if(current){
    bar.hidden = false; bar.classList.add('live');
    const left = Math.max(0, Math.round((d(current.end)-today)/86400000));
    $('statusNum').textContent = current.title;
    $('statusLbl').textContent = `now · ${left} night${left===1?'':'s'} to go`;
  } else if(dep && today < dep){
    bar.hidden = false;
    const days = Math.round((dep-today)/86400000);
    $('statusLbl').textContent = `day${days===1?'':'s'} until ${cities[0] ? cities[0].title : 'departure'}`;
    animateCount($('statusNum'), days);
  }

  // calendar grid
  const calGrid = renderCalendar(t, legs);
  if(calGrid){
    $('calendarWrap').hidden = false;
    $('calendar').innerHTML = calGrid;
  }

  // route map
  renderMap(legs);

  // budget
  $('budgetWrap').hidden = false;
  $('budgetRows').innerHTML = renderBudget(t, legs);

  const parts = [];
  for(let i=0;i<legs.length;i++){
    const l = legs[i];
    const delay = Math.min(i*50, 400);

    if(l.type === 'transit'){
      if(l.group && legs[i+1] && legs[i+1].type === 'transit' && legs[i+1].group === l.group){
        const members = [l];
        let j = i+1;
        while(j<legs.length && legs[j].type==='transit' && legs[j].group===l.group){ members.push(legs[j]); j++; }
        const segs = members.map((m,idx) =>
          transitInner(m) + (idx < members.length-1 ? connectorHtml(m, members[idx+1]) : '')
        ).join('');
        parts.push(`<section class="transit-group" id="leg-${esc(l.id)}" style="animation-delay:${delay}ms">
          <p class="group-label">${esc(l.group)}</p>
          ${segs}
        </section>`);
        i = j-1;
        continue;
      }
      parts.push(transitInner(l, 'standalone', `leg-${esc(l.id)}`, `animation-delay:${delay}ms`));
      continue;
    }

    const n = nights(l.start,l.end);
    const isNow = current && current.id === l.id;
    const lt = l.tz ? localTime(l.tz) : null;
    const staysHtml = (l.stays||[]).map(s => itemRow(s,'stay')).join('');
    const spotsHtml = (l.spots||[]).map(s => itemRow(s,'spot')).join('');
    const legAccom = (l.stays||[]).reduce((s,x) => s + ((x.priceAud||0) * (nights(x.start,x.end)||0)), 0);
    const media = l.image
      ? `<img src="${esc(resizeImg(l.image,1600,900))}" alt="" loading="lazy">`
      : `<div class="mono">${esc(initial(l.title))}</div>`;

    parts.push(`<section class="leg-card ${isNow?'now':''}" id="leg-${esc(l.id)}" data-id="${esc(l.id)}" style="animation-delay:${delay}ms">
      <div class="leg-media">
        ${media}
        ${isNow ? `<span class="now-badge">Now</span>` : ''}
      </div>
      <div class="leg-content">
        <h2>${esc(l.title)}</h2>
        <div class="leg-stats">
          <div class="stat"><span class="v">${dateRange(l.start,l.end)}</span><span class="k">Dates</span></div>
          <div class="stat"><span class="v">${n}</span><span class="k">Night${n===1?'':'s'}</span></div>
        </div>
        ${lt ? `<p class="localtime">Local time ${lt}</p>` : ''}
        ${legAccom ? `<p class="spend">${svgIcon('bed',13)}${money(legAccom)} accommodation</p>` : ''}
        ${l.body ? `<p class="body-text">${esc(l.body)}</p>` : ''}
        ${staysHtml ? `<p class="grp-label">Sleeping</p>${staysHtml}` : ''}
        ${spotsHtml ? `<p class="grp-label">Eat, see, do</p>${spotsHtml}` : ''}
        <div class="row"><a class="lnk" href="${mapLink(l)}" target="_blank" rel="noopener">Open in Maps</a></div>
      </div>
    </section>`);
  }
  $('timeline').innerHTML = parts.join('');

  $('footer').innerHTML = `${cities.length} cities · ${totalNights} nights · ${t.travellers||2} travelling.
    Prices are estimates, not quotes. Edit <code>trip.json</code> and push to update.`;

  if(current){
    const el = document.querySelector('.leg-card.now');
    if(el) el.scrollIntoView({behavior: reduceMotion() ? 'auto' : 'smooth', block:'start'});
  }
}

async function boot(){
  let data = null;
  try{
    const res = await fetch('trip.json?_=' + Date.now());
    if(!res.ok) throw new Error(res.status);
    data = await res.json();
    try{ localStorage.setItem(CACHE_KEY, JSON.stringify(data)); }catch(e){}
  }catch(err){
    try{
      const cached = localStorage.getItem(CACHE_KEY);
      if(cached) data = JSON.parse(cached);
    }catch(e){}
  }

  if(!data){
    $('title').textContent = 'No data yet';
    $('timeline').innerHTML = `<div class="err">
      Couldn't load <code>trip.json</code>. If you opened this file directly from Finder,
      the browser blocks the request. Serve the folder instead:
      <br><br><code>python3 -m http.server 8000</code><br><br>
      then open <code>localhost:8000</code>. On Netlify it just works.
    </div>`;
    return;
  }
  render(data);
}

boot();
</script>
</body>
</html>
